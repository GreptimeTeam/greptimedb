name = "fulltext_bloom_tokens"
reason = "Verify matches_term and LIKE return every matching row from fulltext bloom SSTs written by older binaries, whose tokens don't follow matches_term boundaries, alone and mixed with SSTs written by the current binary."
introduced_by = "fix: fulltext bloom index drops rows matched by matches_term"
topologies = ["distributed", "standalone"]
# The first bloom format is what this case reads: a released binary that already
# writes bloom_version 2 (v1.3.0 and later) produces no old-format SST, so the
# case is exercised only against v1.2.x and older.
from_range = ["<=v1.2.99"]
to_range = ["*"]
features = ["table", "sst", "fulltext"]
owner = "storage"
