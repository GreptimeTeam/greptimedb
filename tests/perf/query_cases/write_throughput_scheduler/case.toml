# Write-throughput regression case for the workload scheduler (PR #8736).
#
# Measures pure remote-write ingestion throughput and latency on base
# (scheduler off) vs candidate (scheduler on) under a single-class backlog:
# the scheduler must be work-conserving and must not regress write throughput.
#
# The runner derives the scheduler enable flag per target from the
# [scenario.scheduler] section below: the base target always starts its
# datanode with GREPTIMEDB_DATANODE__RUNTIME__EXPERIMENTAL_WORKLOAD_SCHEDULER__ENABLE=false
# and the candidate target with ENABLE=true plus the weights/max_polls below
# (injected as datanode environment variables, since the runner spawns the
# datanode with CLI args only). `enable` is intentionally not set here.
#
# Sized for a local run: 2048 series x 3600 samples = 7,372,800 rows per target.
# The ingestion is split into 20 sample chunks of 180 samples per series; the
# measurement spans the first 60s (12 windows of 5s). Gates: <= 5% failed
# chunks, <= 10% mean-RPS regression, <= 10% p99-latency regression, and an
# absolute floor of 15k rows/s per target.

[case]
name = "write_throughput_scheduler"
description = "Pure remote-write ingestion throughput/latency for validating work-conserving scheduler behavior under single-class backlog"
issue = "https://github.com/GreptimeTeam/greptimedb/pull/8736"

[scenario]
kind = "write_throughput"

[scenario.scheduler]
# enable is not set here: the runner derives it per target (base = disabled,
# candidate = enabled). max_concurrent_polls 0 = 4 * global_rt_size.
max_concurrent_polls = 16
query_weight = 2
write_weight = 8

[scenario.remote_write]
database = "public"
metric = "write_throughput_scheduler"
physical_table = "greptime_physical_table"
series_count = 2048
samples_per_series = 3600
sample_chunk_size = 180
flush_every_sample_chunks = 1
start_unix_millis = 1_704_067_200_000 # 2024-01-01T00:00:00Z
step_millis = 1000
chunk_series_count = 256
timeout_seconds = 120

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 1_000_000
max_concurrent_flushes = 256

[scenario.write_measure]
duration_seconds = 60
window_seconds = 5
target_rps = 0 # 0 = max throughput; the achieved rate is measured

[scenario.write_measure.thresholds]
max_failure_rate = 0.05
max_mean_rps_regression_pct = 10
max_p99_latency_regression_pct = 10
min_rps_absolute = 15000
