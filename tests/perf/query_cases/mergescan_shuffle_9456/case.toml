# Opt-in comparison of Hash RepartitionExec cost on a multi-region PromQL join.
# ANALYZE records plans and metrics; EVAL preserves complete results for comparison.

[case]
name = "mergescan_shuffle_9456"
description = "Opt-in multi-region Partitioned PromQL shuffle cost measurement"
issue = "https://github.com/GreptimeTeam/greptimedb/issues/9456"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "mergescan_shuffle_9456"
physical_table = "mergescan_shuffle_phys"
series_count = 4096
samples_per_series = 120
start_unix_millis = 1704067200000
step_millis = 60000
chunk_series_count = 128
timeout_seconds = 300
visibility_timeout_seconds = 300

base_setup_sql = [
  """
