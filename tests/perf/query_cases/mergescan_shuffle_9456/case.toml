[[scenario.queries]]
name = "partitioned_shuffle_cost"
kind = "tql"
query = "TQL ANALYZE VERBOSE (1704067200, 1704074340, '1m') rate(mergescan_shuffle_9456[5m]) / ignoring(host) rate(mergescan_shuffle_9456[5m])"
warmup = 1
iterations = 7

[[scenario.queries]]
name = "collect_left_control"
kind = "tql"
query = "TQL ANALYZE VERBOSE (1704067200, 1704074340, '1m') rate(mergescan_shuffle_9456[5m]) / rate(mergescan_shuffle_9456[5m])"
warmup = 1
iterations = 7

[[scenario.queries]]
name = "partitioned_complete_results"
kind = "tql"
query = "TQL EVAL (1704067200, 1704074340, '1m') rate(mergescan_shuffle_9456[5m]) / ignoring(host) rate(mergescan_shuffle_9456[5m])"
warmup = 0
iterations = 1
