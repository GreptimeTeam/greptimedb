# SQL distributed broadcast-join case over direct SSTs.
#
# The case measures the nested broadcast join rewrite of the experimental
# `experimental_dist_join` opt-in: the join of a large probe (fact) table with a
# small build (dimension) table. The candidate target opts into the rewrite for
# its queries with `candidate_session_sql`, the base target runs the same query
# without the opt-in (and without a build that knows the setting yet), so the
# report compares "join on the frontend" with "join next to the probe data".
#
# The heuristic compares `probe_regions * build_bytes` with `probe_bytes`, so a
# single-region fact table with a much smaller dimension table already favors the
# build side by a wide margin. A single region per table is enough for the
# heuristic and keeps the case on the supported one-region-per-table direct-SST
# fixture path; the layout stays `regions = 1`, and the fact table is made large
# with rows instead of regions.
#
# Both tables also have to be reported as leaders with a non-zero disk size
# before the rewrite can fire: `query_regression_runner measure` waits for that
# in `information_schema.region_statistics` before it measures a direct-SST case.

[case]
name = "sql_join_dist_broadcast"
description = "Distributed broadcast join (nested MergeScan rewrite) over a large fact table and a small dimension table"

[scenario]
kind = "direct_readable_sst"
seed = 1004

# The probe side of the join: the large fact table that the join runs on.
[[scenario.tables]]
database = "public"
name = "sql_join_dist_fact"
engine = "mito"
append_mode = true
sst_format = "flat"
primary_key = ["host", "instance"]
time_index = "ts"
sst_count = 32
rows_per_sst = 8192

[[scenario.tables.columns]]
name = "host"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 16, prefix = "host" }

[[scenario.tables.columns]]
name = "instance"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 64, prefix = "instance" }

[[scenario.tables.columns]]
name = "value"
type = "DOUBLE"
semantic = "field"
distribution = { kind = "deterministic_wave", min = 1.0, max = 500.0 }

[[scenario.tables.columns]]
name = "ts"
type = "TIMESTAMP(9)"
semantic = "timestamp"

# The build side of the join: one row per host, so the join matches once per fact
# row and the build side stays small enough to be broadcast to the probe region.
[[scenario.tables]]
database = "public"
name = "sql_join_dist_dim"
engine = "mito"
append_mode = true
sst_format = "flat"
primary_key = ["host", "zone"]
time_index = "ts"
sst_count = 1
rows_per_sst = 16

[[scenario.tables.columns]]
name = "host"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 16, prefix = "host" }

[[scenario.tables.columns]]
name = "zone"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 4, prefix = "zone" }

[[scenario.tables.columns]]
name = "weight"
type = "DOUBLE"
semantic = "field"
distribution = { kind = "deterministic_wave", min = 0.1, max = 10.0 }

[[scenario.tables.columns]]
name = "ts"
type = "TIMESTAMP(9)"
semantic = "timestamp"

[scenario.layout]
regions = 1
# Shared fallbacks; the tables above size themselves with their own sst_count and
# rows_per_sst. 32 x 8192 fact rows and one 16-row dimension SST keep the fact
# table orders of magnitude larger than the dimension table.
sst_count = 32
rows_per_sst = 8192
row_group_size = 1024
series_count = 64
start_unix_nanos = 1704067200000000000
step_nanos = 1000000000
time_range_layout = "non_overlapping_per_sst"
series_layout = "round_robin"

[[scenario.queries]]
name = "join_dist_broadcast_aggregate_top"
kind = "sql"
query = "SELECT f.host, d.zone, avg(f.value * d.weight) AS score FROM sql_join_dist_fact f JOIN sql_join_dist_dim d ON f.host = d.host WHERE f.ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND f.ts < '2024-01-05 00:00:00+0000'::TIMESTAMP AND d.ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND d.ts < '2024-01-01 01:00:00+0000'::TIMESTAMP AND d.zone IN ('zone1', 'zone2') GROUP BY f.host, d.zone ORDER BY score DESC LIMIT 10"
# Every request of `/v1/sql` gets its own session context, so the opt-in has to
# travel with the query it should affect. Only the candidate target runs these
# statements; the base target measures the same query with the default rewrite
# behavior.
candidate_session_sql = ["SET experimental_dist_join = true"]
warmup = 1
iterations = 3

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 50
