# Metric-engine read case targeting S3 (bulk-memtable unordered-part sort
# caching) plus P8 probes (PromQL over_time per-window clone). Data is ingested
# through the normal Prometheus remote-write path (metric engine -> mito2
# physical data region, which forces memtable.type=bulk).
#
# CAVEAT (harness behavior): query_regression_runner/ingest.rs always issues an
# ADMIN FLUSH_TABLE of the physical table after the last sample chunk, so the
# remote-write rows are in SSTs when measurement starts. The first query below
# therefore inserts rows via /v1/sql; those land in the bulk memtable's
# unordered part and are re-sorted on every read (concat_and_sort) -- the S3
# cost that a cached sort would remove on later iterations.
#
# The TQL over_time queries are P8 probes. They live on the metric-engine path
# because the direct-SST path (direct_readable_sst scenarios) is blocked on main
# 9fab11271b by a pre-existing MergeScan metadata-mismatch bug for projected
# tag/field columns; the metric-engine path is unaffected (verified empirically).

[case]
name = "memtable_unflushed_read"
description = "S3: metric-engine reads with bulk-memtable unordered INSERT fragments; P8: TQL over_time probes"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "memtable_unflushed_read"
physical_table = "greptime_physical_table"
series_count = 16384
samples_per_series = 120
sample_chunk_size = 120
flush_every_sample_chunks = 1
start_unix_millis = 1_704_067_200_000 # 2024-01-01T00:00:00Z
step_millis = 60000
chunk_series_count = 512
timeout_seconds = 300
visibility_timeout_seconds = 120

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 1_000_000
max_concurrent_flushes = 256
worker_channel_capacity = 65526
max_inflight_requests = 3000

[[scenario.queries]]
name = "seed_memtable_fragments"
