query = "TQL ANALYZE VERBOSE (1704067200, 1704074400, '1m') min_over_time(memtable_unflushed_read{host=~'host.*'}[10m])"
warmup = 1
iterations = 3

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 50

