[[scenario.queries]]
name = "validate_remote_write_source"
kind = "sql"
query = "SELECT count(*) FROM bloom_fulltext_build_cost"
warmup = 0
iterations = 1

[[scenario.queries]]
name = "indexed_insert_0"
kind = "sql"
query = "INSERT INTO bloom_fulltext_build_cost_indexed_0 SELECT instance, concat('INFO request completed service=', instance, ' request_id=', CAST(greptime_value AS STRING), ' path=/api/v1/item/', CAST(greptime_value AS STRING), ' duration_ms=', CAST(greptime_value AS STRING), ' status=OK'), greptime_timestamp FROM bloom_fulltext_build_cost"
warmup = 0
iterations = 1
[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 30

[[scenario.queries]]
name = "indexed_preflush_explain_0"
kind = "sql"
query = "EXPLAIN ANALYZE VERBOSE SELECT count(*) FROM bloom_fulltext_build_cost_indexed_0 WHERE msg IS NOT NULL"
warmup = 0
iterations = 1

[[scenario.queries]]
name = "indexed_flush_0"
kind = "sql"
query = "ADMIN FLUSH_TABLE('bloom_fulltext_build_cost_indexed_0')"
warmup = 0
iterations = 1
[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 30

