# Fixed remote-write fixture comparing synchronous Bloom full-text index build cost.
# This measures insert/flush/index work, not isolated tokenizer time; see README.md.

[case]
name = "bloom_fulltext_build_cost"
description = "Compare synchronous Bloom full-text index build cost on a fixed remote-write workload"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "bloom_fulltext_build_cost"
physical_table = "bloom_fulltext_build_cost_physical"
series_count = 64
samples_per_series = 512
sample_chunk_size = 512
flush_every_sample_chunks = 1
start_unix_millis = 1704067200000
step_millis = 15000
chunk_series_count = 64
timeout_seconds = 600
visibility_timeout_seconds = 300
base_setup_sql = [
  "CREATE TABLE bloom_fulltext_build_cost_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'compaction.type'='twcs', 'compaction.twcs.trigger_file_num'='100')",
  "CREATE TABLE bloom_fulltext_build_cost_indexed_0 (instance STRING, msg STRING FULLTEXT INDEX WITH(analyzer='English', backend='bloom', case_sensitive='false', false_positive_rate='0.01', granularity='10240'), ts TIMESTAMP TIME INDEX, PRIMARY KEY(instance)) ENGINE=mito WITH ('append_mode'='true', 'compaction.type'='twcs', 'compaction.twcs.trigger_file_num'='100')",
