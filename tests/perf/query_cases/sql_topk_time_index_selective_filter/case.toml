# A selective filter under ORDER BY ts DESC LIMIT. The TopK fills from the newest
# matching rows and its dynamic filter lets the scan skip older SSTs; a change that
# delays the threshold makes the scan read every SST.

[case]
name = "sql_topk_time_index_selective_filter"
description = "ORDER BY time index DESC LIMIT with a 1-in-1000 filter over 64 time-split SSTs"

[scenario]
kind = "direct_readable_sst"
seed = 10515

[[scenario.tables]]
database = "public"
name = "sql_topk_time_index_selective_filter"
engine = "mito"
append_mode = true
sst_format = "flat"
primary_key = ["host"]
time_index = "ts"

[[scenario.tables.columns]]
name = "host"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 16, prefix = "host" }

[[scenario.tables.columns]]
name = "num"
type = "UINT64"
semantic = "field"

[[scenario.tables.columns]]
name = "ts"
type = "TIMESTAMP(9)"
semantic = "timestamp"

[scenario.layout]
regions = 1
sst_count = 64
rows_per_sst = 131072
row_group_size = 16384
series_count = 16
start_unix_nanos = 1704067200000000000
step_nanos = 1000000000
time_range_layout = "non_overlapping_per_sst"
series_layout = "round_robin"

[[scenario.queries]]
name = "topk_ts_desc_selective_filter"
kind = "sql"
query = "SELECT ts, host, num FROM sql_topk_time_index_selective_filter WHERE num % 1000 = 7 ORDER BY ts DESC LIMIT 100"
warmup = 2
iterations = 10

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 30
