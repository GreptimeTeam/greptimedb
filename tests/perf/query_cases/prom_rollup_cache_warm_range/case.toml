# Frontend rollup cache: warm historical range against an uncached base.
#
# The cache is a frontend-local, PromQL-range-only cache
# (src/frontend/src/query_cache.rs). It is read-through — the request that misses
# executes storage and stores what it read — and it serves a canonical chunk
# until the chunk reaches `ttl`; nothing probes the source. It refuses
# expressions outside the `selector`/`rate`/`sum` allowlist
# (src/query/src/promql/window.rs). This case therefore:
#
# - writes historical data in 2024, so every evaluated point is older than the
#   wall clock and `tail = "0s"` leaves the whole range cacheable;
# - evaluates a 6h range at a 5m step, 02:00–08:00 inclusive, which is 73
#   points; the configured chunk is a target that planning aligns down to whole
#   steps (at least one), so the 5m target meets the 5m step exactly and holds one
#   grid point per chunk: all 73 are cacheable and the request has zero direct
#   spans;
# - queries the Prometheus HTTP range API (`kind = "prom_http"`), the path that
#   marks the output unordered and is therefore the one the cache serves, with
#   `rate(...)` and a `sum` fold of `rate(...)`, both cacheable;
# - keeps the bare named selector as a no-regression control: a bare top-level
#   selector bypasses the cache on the candidate, so that query measures the same
#   path on both targets and only guards against a slowdown;
# - configures the cache for the candidate only. The shared `prom_store` renders
#   no `[rollup_cache]` table at all, so the base frontend keeps the default
#   (cache disabled) and the case compares "cached candidate" with "uncached
#   base" instead of a cache against itself.
#
# The fill happens on the request path, so there is no warm round and nothing to
# wait for: the first `warmup` repetition of each query executes and fills, the
# remaining ones hit, and the measured iterations hit. `ttl` is the cache's whole
# freshness rule, and an hour is far longer than this run, so no entry ages out
# between the fill and the measurements.
#
# `min_candidate_latency_speedup_pct` on the two cached shapes is what keeps this
# case honest: a candidate whose cache did not take effect (option ignored,
# expression outside the allowlist, ttl too short to serve the second request)
# measures the same latency as the base and fails the threshold instead of
# passing quietly. The selector query and the TQL control carry
# `max_candidate_latency_regression_pct` instead, because neither is expected to
# be faster than the base.

[case]
name = "prom_rollup_cache_warm_range"
description = "Frontend rollup cache serving warm historical PromQL ranges against an uncached base"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "prom_rollup_cache_warm_range"
physical_table = "greptime_physical_table"
series_count = 2048
samples_per_series = 720
sample_chunk_size = 240
flush_every_sample_chunks = 1
start_unix_millis = 1_704_067_200_000 # 2024-01-01T00:00:00Z
step_millis = 60_000
chunk_series_count = 256
timeout_seconds = 600
visibility_timeout_seconds = 300

# `linear` is a per-series monotonic counter, so `rate(...)` folds a realistic
# increasing signal.
[scenario.remote_write.value]
pattern = "linear"
base = 0.0
step = 0.125

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 100000

# Candidate only. `chunk = "5m"` is a target that planning aligns down to whole
# steps, here one 5m step, `tail = "0s"` keeps the 2024 data inside the cacheable
# range, and `ttl = "1h"` is far longer than the run, so a chunk filled by the
# first warmup repetition is still served during the measured ones. The ttl is
# the whole freshness rule: it is what the cache trades for never reading the
# source on the request path, so it is also the bound on how stale a served
# chunk may be.
[scenario.remote_write.prom_store.candidate_rollup_cache]
max_bytes = "256MB"
chunk = "5m"
tail = "0s"
ttl = "1h"

# Control: a bare top-level selector bypasses the cache on the candidate
# (`windowed_expr_is_bare_selector`), because serving 2048 series x 73 points out
# of a cached payload measured slower than scanning them. Both targets therefore
# run the same path, so this query is a no-regression control rather than a
# speedup query: it catches a cache that slowed the selector down, not one that
# failed to cache it.
[[scenario.queries]]
name = "prom_range_selector_6h_5m_bypass_control"
kind = "prom_http"
query = "prom_rollup_cache_warm_range{host=~\"host.*\"}"
start = "1704074400" # 2024-01-01T02:00:00Z
end = "1704096000" # 2024-01-01T08:00:00Z
step = "5m"
warmup = 3
iterations = 7

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 25

# `rate(...)` folds 5m of input per output point, so the uncached base reads far
# more rows than it returns while the cached candidate returns the same payload.
# The Prometheus JSON response and the merged rows are the floor either way.
# Measured 18.5% once, so the gate sits at 10%: well under that measurement, but
# still out of reach for a candidate whose cache did not take effect.
[[scenario.queries]]
name = "prom_range_rate_5m_6h_5m"
kind = "prom_http"
query = "rate(prom_rollup_cache_warm_range{host=~\"host.*\"}[5m])"
start = "1704074400"
end = "1704096000"
step = "5m"
warmup = 3
iterations = 7

[scenario.queries.thresholds]
min_candidate_latency_speedup_pct = 10

# `sum` is the one admitted aggregate; grouping by `host` folds 2048 series into
# 1024 groups, so the base keeps its full input read while the cached candidate
# returns the folded payload. Measured 58% once, so the gate stays at 25%.
[[scenario.queries]]
name = "prom_range_sum_rate_by_host_6h_5m"
kind = "prom_http"
query = "sum by (host) (rate(prom_rollup_cache_warm_range{host=~\"host.*\"}[5m]))"
start = "1704074400"
end = "1704096000"
step = "5m"
warmup = 3
iterations = 7

[scenario.queries.thresholds]
min_candidate_latency_speedup_pct = 25

# Control: `TQL` never consults the rollup cache, so both targets run the same
# storage path. It is where an ordinary scan/execution regression shows up, and it
# protects the speedup thresholds above from being satisfied by a slower base. The
# gate is 50% rather than 25% only because that path is noisy run to run on a
# shared runner; it is still tight enough to catch a real scan regression.
[[scenario.queries]]
name = "tql_rate_5m_1h_uncached_control"
kind = "tql"
query = "TQL ANALYZE VERBOSE (1704074400, 1704078000, '1m') rate(prom_rollup_cache_warm_range{host=~'host.*'}[5m])"
warmup = 1
iterations = 5

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 50
