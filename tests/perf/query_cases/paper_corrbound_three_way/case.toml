[[scenario.queries]]
name = "diagnostic_source_counts"
kind = "sql"
query = "SELECT 'R' AS source, COUNT(*) AS row_count FROM paper_corrbound_r WHERE ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND ts < '2024-01-01 00:18:08+0000'::TIMESTAMP AND (ts < '2024-01-01 00:01:04+0000'::TIMESTAMP OR host = 'h0') UNION ALL SELECT 'S_aligned', COUNT(*) FROM paper_corrbound_s WHERE ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND ts < '2024-01-01 00:18:08+0000'::TIMESTAMP AND (ts < '2024-01-01 00:01:04+0000'::TIMESTAMP OR host = 'h0') UNION ALL SELECT 'S_anti', COUNT(*) FROM paper_corrbound_s WHERE ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND ts < '2024-01-01 00:18:08+0000'::TIMESTAMP AND (ts < '2024-01-01 00:01:04+0000'::TIMESTAMP OR host = 'h1') UNION ALL SELECT 'T', COUNT(*) FROM paper_corrbound_t WHERE ts >= '2024-01-01 00:00:00+0000'::TIMESTAMP AND ts < '2024-01-01 00:34:08+0000'::TIMESTAMP ORDER BY source"
warmup = 0
iterations = 1
