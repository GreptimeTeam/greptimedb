# SQL DML workload: large multi-row INSERT statements via /v1/sql followed by
# reads. Targets E9/F1 (per-batch DML hoists -- latency of a 10k-row INSERT is
# proportional to the batch count) and also exercises S3 (inserted rows stay in
# the bulk memtable's unordered part; every read re-sorts the fragments).
# The direct-SST fixture is intentionally tiny: the INSERTs are the payload.

[case]
name = "sql_dml_batch_hoist"
description = "E9/F1: large multi-row INSERT latency; SELECTs read unflushed bulk-memtable fragments (S3). NOTE: tag projections are avoided because main 9fab11271b has a MergeScan metadata-mismatch bug for direct-SST tag columns."

[scenario]
kind = "direct_readable_sst"
seed = 1304


[[scenario.tables]]
database = "public"
name = "sql_dml_batch_hoist"
engine = "mito"
append_mode = true
sst_format = "flat"
primary_key = ["host"]
time_index = "ts"

[[scenario.tables.columns]]
name = "host"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 8, prefix = "host" }

[[scenario.tables.columns]]
name = "cpu"
type = "DOUBLE"
semantic = "field"
distribution = { kind = "deterministic_wave", min = 0.0, max = 100.0 }

[[scenario.tables.columns]]
name = "ts"
type = "TIMESTAMP(9)"
semantic = "timestamp"

[scenario.layout]
regions = 1
sst_count = 8
rows_per_sst = 512
row_group_size = 128
series_count = 8
start_unix_nanos = 1704067200000000000
step_nanos = 1000000000
time_range_layout = "non_overlapping_per_sst"
series_layout = "timestamp_major"

[[scenario.queries]]
