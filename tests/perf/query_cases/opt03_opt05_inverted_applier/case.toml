# Shared fixture-only A/B case for the OPT03/OPT05 inverted-index applier work.
# The generic remote-write fixture generator must not hard-code applier behavior;
# this file only supplies one schema/layout/query instance. Both targets create
# the same physical metric table with an inverted index and flush every one of
# the four sample chunks, so query samples exercise the applier over multiple
# flushed indexed SSTs with the range/index result caches disabled.
#
# Manual result inspection (counts are not gated automatically):
#   host0001 + instance000001 -> 1024
#   host0001 + instance001025 -> 1024
#   all rows                  -> 2097152
#   instance999999            -> 0
# The EXPLAIN ANALYZE VERBOSE queries are diagnostics for the actual applier
# metrics; do not read a speedup out of their single timed sample.

[case]
name = "opt03_opt05_inverted_applier"
description = "A/B inverted-index applier over flushed indexed Prometheus metric SSTs"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "opt03_opt05_inverted_applier"
physical_table = "opt03_opt05_inverted_applier_physical"
disable_index_result_cache = true
series_count = 2048
samples_per_series = 1024
sample_chunk_size = 256
flush_every_sample_chunks = 1
start_unix_millis = 1704067200000
step_millis = 60000
chunk_series_count = 256
timeout_seconds = 600
visibility_timeout_seconds = 120
base_setup_sql = [
  "CREATE TABLE opt03_opt05_inverted_applier_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'index.type'='inverted', 'compaction.twcs.trigger_file_num'='100')",
]
candidate_setup_sql = [
  "CREATE TABLE opt03_opt05_inverted_applier_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'index.type'='inverted', 'compaction.twcs.trigger_file_num'='100')",
]

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 100000

[[scenario.queries]]
name = "host_and_instance_present"
kind = "sql"
query = "SELECT count(*) FROM opt03_opt05_inverted_applier WHERE host = 'host0001' AND instance = 'instance000001'"
warmup = 3
iterations = 20

[[scenario.queries]]
name = "host_and_second_instance_present"
kind = "sql"
query = "SELECT count(*) FROM opt03_opt05_inverted_applier WHERE host = 'host0001' AND instance = 'instance001025'"
warmup = 3
iterations = 20

[[scenario.queries]]
name = "explain_host_and_instance_present"
kind = "sql"
query = "EXPLAIN ANALYZE VERBOSE SELECT count(*) FROM opt03_opt05_inverted_applier WHERE host = 'host0001' AND instance = 'instance000001'"
warmup = 0
iterations = 1

[[scenario.queries]]
name = "explain_host_and_second_instance_present"
kind = "sql"
query = "EXPLAIN ANALYZE VERBOSE SELECT count(*) FROM opt03_opt05_inverted_applier WHERE host = 'host0001' AND instance = 'instance001025'"
warmup = 0
iterations = 1

[[scenario.queries]]
name = "all_rows_control"
kind = "sql"
query = "SELECT count(*) FROM opt03_opt05_inverted_applier"
warmup = 3
iterations = 9

[[scenario.queries]]
name = "absent_instance_control"
kind = "sql"
query = "SELECT count(*) FROM opt03_opt05_inverted_applier WHERE instance = 'instance999999'"
warmup = 3
iterations = 9
