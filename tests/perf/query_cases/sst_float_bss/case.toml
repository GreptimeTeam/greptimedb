# Default all-group default-versus-BSS storage and warmed-query comparison.

[case]
name = "sst_float_bss"
description = "Compare default and byte-stream-split floating-point SST bytes and warmed value-scanning query latency with bounded 95/5 per-series DOUBLE values"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "sst_float_bss"
physical_table = "sst_float_bss_physical"
series_count = 1000
samples_per_series = 4320
sample_chunk_size = 1440
flush_every_sample_chunks = 1
start_unix_millis = 1_704_067_200_000 # 2024-01-01T00:00:00Z
step_millis = 60000
chunk_series_count = 128
timeout_seconds = 600
visibility_timeout_seconds = 300

# Omit the default encoding from base setup because older binaries do not recognize it.
# `compaction.twcs.trigger_file_num` is carried over from the earlier revision; nothing in this
# case depends on its semantics, which differ between builds. Only the shared post_ingest_sql
# below establishes the measured layout.
base_setup_sql = [
  "CREATE TABLE sst_float_bss_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'compaction.twcs.trigger_file_num'='100')",
]
candidate_setup_sql = [
  "CREATE TABLE sst_float_bss_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'experimental_sst_float_field_encoding'='byte_stream_split', 'compaction.twcs.trigger_file_num'='100')",
]

# One shared list for both targets, run after ingestion and its visibility count check and
# before any measurement. Statement 1 rewrites the physical table into one strict-window file
# per day (86400 seconds; v1.1.0 rejects start_time/end_time options, so the whole table is
# compacted) so base and candidate are measured on the same three 2024-01-01..03 daily SSTs,
# whatever layout the flushes or any automatic compaction produced beforehand.
# Statement 2 fails closed unless the physical table has exactly three live data SSTs,
# 1440000 rows each (4320000 total) with the exact daily windows. Statement 3 fails closed
# unless the logical metric table still returns all 4320000 rows after compaction, so a
# compaction that changes the row count cannot be measured. Both guards raise a runtime
# cast error instead of returning a value; the cast inputs are data-derived (aggregates), so
# the checks cannot be constant-folded away, and an empty result set takes the error branch.
post_ingest_sql = [
  "ADMIN compact_table('sst_float_bss_physical', 'strict_window', 'window=86400')",
  "SELECT CASE WHEN count(*) = 3 AND sum(num_rows) = 4320000 AND min(num_rows) = 1440000 AND max(num_rows) = 1440000 AND count(DISTINCT min_ts) = 3 AND count(CASE WHEN (min_ts = TIMESTAMP '2024-01-01 00:00:00' AND max_ts = TIMESTAMP '2024-01-01 23:59:00') OR (min_ts = TIMESTAMP '2024-01-02 00:00:00' AND max_ts = TIMESTAMP '2024-01-02 23:59:00') OR (min_ts = TIMESTAMP '2024-01-03 00:00:00' AND max_ts = TIMESTAMP '2024-01-03 23:59:00') THEN 1 END) = 3 THEN 0 ELSE CAST(CASE WHEN count(*) = 3 THEN 'sst_float_bss: expected 1440000 rows per live data SST in the 2024-01-01..03 daily windows' ELSE 'sst_float_bss: expected exactly 3 live data SSTs after strict-window compaction' END AS BIGINT) END FROM information_schema.ssts_manifest WHERE table_id = (SELECT table_id FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'sst_float_bss_physical') AND region_group = 0 AND visible = true",
  "SELECT CASE WHEN count(*) = 4320000 THEN 0 ELSE CAST(CASE WHEN count(*) = 4320000 THEN 'ok' ELSE 'sst_float_bss: expected 4320000 logical rows after strict-window compaction' END AS BIGINT) END FROM sst_float_bss",
]

[scenario.remote_write.value]
# Synthetic, not empirical: 95% integral and 5% nonintegral series vary
# smoothly within deterministic per-series ranges; series are not a global monotonic counter.
pattern = "bounded_mixed"
base = 0
step = 1
cardinality = 1000
seed = 42
mixed_every = 20
run_length = 60

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 100000

[scenario.remote_write.storage]
root_suffix = "data/greptime/public"
column = "greptime_value"
min_files = 1
min_files_with_column = 1
# The pre-measurement SQL guard checks the three live data SSTs of the physical
# table. This inspect-time check additionally rejects any obsolete compaction
# input still on disk when the stopped data directory is inspected, and skips
# the read-bench instead of benchmarking mixed file generations.
exact_files = 3
max_candidate_total_file_size_regression_pct = -5.0

[scenario.remote_write.read_bench]
enabled = true
parquetbench = true
scanbench = true
iterations = 7
projection = ["greptime_value"]
parquet_reader = "direct"
scan_scanner = "seq"
parallelism = 1

[[scenario.queries]]
name = "sum_all_values"
kind = "sql"
query = "SELECT sum(greptime_value) FROM sst_float_bss"
warmup = 3
iterations = 15

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 25

[[scenario.queries]]
name = "hourly_sum_values"
kind = "sql"
query = "SELECT date_bin(INTERVAL '1 hour', greptime_timestamp) AS time_window, sum(greptime_value) FROM sst_float_bss WHERE greptime_timestamp >= TIMESTAMP '2024-01-01 00:00:00' AND greptime_timestamp < TIMESTAMP '2024-01-04 00:00:00' GROUP BY time_window ORDER BY time_window"
warmup = 3
iterations = 15

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 25
