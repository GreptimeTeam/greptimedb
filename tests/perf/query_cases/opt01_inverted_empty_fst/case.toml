[case]
name = "opt01_inverted_empty_fst"
description = "Compare inverted-index scans when one FST matcher has no values on flushed metric SSTs"

[scenario]
kind = "prom_remote_write_then_query"

[scenario.remote_write]
database = "public"
metric = "opt01_inverted_empty_fst"
physical_table = "opt01_inverted_empty_fst_physical"
disable_index_result_cache = true
series_count = 2048
samples_per_series = 1024
sample_chunk_size = 256
flush_every_sample_chunks = 1
start_unix_millis = 1704067200000
step_millis = 60000
chunk_series_count = 256
timeout_seconds = 600
visibility_timeout_seconds = 120
base_setup_sql = [
  "CREATE TABLE opt01_inverted_empty_fst_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'index.type'='inverted', 'compaction.twcs.trigger_file_num'='100')",
]
candidate_setup_sql = [
  "CREATE TABLE opt01_inverted_empty_fst_physical (greptime_timestamp TIMESTAMP TIME INDEX, greptime_value DOUBLE) ENGINE=metric WITH ('physical_metric_table'='', 'index.type'='inverted', 'compaction.twcs.trigger_file_num'='100')",
]

[scenario.remote_write.prom_store]
pending_rows_flush_interval = "1s"
max_batch_rows = 100000

[[scenario.queries]]
name = "host_and_instance_match"
kind = "sql"
query = "SELECT count(*) FROM opt01_inverted_empty_fst WHERE host = 'host0001' AND instance = 'instance000001'"
warmup = 1
iterations = 2

[[scenario.queries]]
name = "single_absent_instance"
kind = "sql"
query = "SELECT count(*) FROM opt01_inverted_empty_fst WHERE instance = 'instance999999'"
warmup = 1
iterations = 2

[[scenario.queries]]
name = "all_rows"
kind = "sql"
query = "SELECT count(*) FROM opt01_inverted_empty_fst"
warmup = 1
iterations = 2

[[scenario.queries]]
name = "host_match_with_absent_instance"
kind = "sql"
query = "SELECT count(*) FROM opt01_inverted_empty_fst WHERE host = 'host0001' AND instance = 'instance999999'"
warmup = 3
iterations = 20

[[scenario.queries]]
name = "host_match_with_absent_instance_explain"
kind = "sql"
query = "EXPLAIN ANALYZE VERBOSE SELECT count(*) FROM opt01_inverted_empty_fst WHERE host = 'host0001' AND instance = 'instance999999'"
warmup = 0
iterations = 1
