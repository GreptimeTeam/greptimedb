# Minimal native Query Regression fixture for the narrow direct-prom-rate sum fusion candidate.
# This deterministic wave is not the original 127-slope counter/input archive.
# Retain complete raw responses for parity auditing; passing thresholds only means
# the configured latency guard did not trip, not that fusion or a speedup was proven.

[case]
name = "promql_series_rate_fusion"
description = "PromQL rate-only grouped sum fusion regression fixture"

[scenario]
kind = "direct_readable_sst"
seed = 25652

[[scenario.tables]]
database = "public"
name = "promql_series_rate_fusion"
engine = "mito"
append_mode = true
sst_format = "flat"
primary_key = ["instance", "dc", "device"]
time_index = "ts"

[[scenario.tables.columns]]
name = "instance"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 4096, prefix = "instance" }

[[scenario.tables.columns]]
name = "dc"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 16, prefix = "dc" }

[[scenario.tables.columns]]
name = "device"
type = "STRING"
semantic = "tag"
distribution = { kind = "cardinality", values = 4, prefix = "device" }

[[scenario.tables.columns]]
name = "val"
type = "DOUBLE"
semantic = "field"
distribution = { kind = "deterministic_wave", min = 0.0, max = 100.0 }

[[scenario.tables.columns]]
name = "ts"
type = "TIMESTAMP(3)"
semantic = "timestamp"

[scenario.layout]
regions = 1
sst_count = 2
rows_per_sst = 1048576
row_group_size = 8192
series_count = 4096
start_unix_nanos = 1704067200000000000
step_nanos = 15000000000
time_range_layout = "non_overlapping_per_sst"
series_layout = "timestamp_major"

# 122 evaluations * 16 dc groups = 1,952 output rows. Each range evaluates
# 4,096 series at 122 timestamps (499,712 evaluated series points). This range
# crosses the first-SST boundary (1704071025); its initial 5m lookback starts
# at 1704069600, ensuring both SSTs are in the requested time span.
[[scenario.queries]]
name = "grouped_rate_sum_range"
kind = "tql"
query = "TQL EVAL (1704069900, 1704071715, '15s') sum by (dc) (rate(promql_series_rate_fusion[5m]))"
warmup = 3
iterations = 20

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 10

# Same complete response shape at the latest timestamp: 16 groups.
[[scenario.queries]]
name = "grouped_rate_sum_instant"
kind = "tql"
query = "TQL EVAL (1704071715, 1704071715, '15s') sum by (dc) (rate(promql_series_rate_fusion[5m]))"
warmup = 3
iterations = 9

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 10

# Separate diagnostics are intentionally not included in timed samples.
[[scenario.queries]]
name = "analyze_grouped_rate_sum_range"
kind = "tql"
query = "TQL ANALYZE VERBOSE (1704069900, 1704071715, '15s') sum by (dc) (rate(promql_series_rate_fusion[5m]))"
warmup = 0
iterations = 1

[[scenario.queries]]
name = "analyze_grouped_rate_sum_instant"
kind = "tql"
query = "TQL ANALYZE VERBOSE (1704071715, 1704071715, '15s') sum by (dc) (rate(promql_series_rate_fusion[5m]))"
warmup = 0
iterations = 1

# Wider/non-rate path: does not match the direct rate-only fusion candidate.
[[scenario.queries]]
name = "grouped_sum_over_time_control"
kind = "tql"
query = "TQL EVAL (1704069900, 1704071715, '15s') sum by (dc) (sum_over_time(promql_series_rate_fusion[5m]))"
warmup = 3
iterations = 9

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 10

# MIN is a distinct aggregation operator, so it must not match the SUM fusion
# candidate. It retains the same rate-window work and compact grouped response.
[[scenario.queries]]
name = "grouped_rate_min_control"
kind = "tql"
query = "TQL EVAL (1704069900, 1704071715, '15s') min by (dc) (rate(promql_series_rate_fusion[5m]))"
warmup = 3
iterations = 9

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 10

# Complete-table materialization audit: 16 rows, each dc has 131072 rows and
# 256 instances, with timestamps spanning the entire two-SST fixture.
[[scenario.queries]]
name = "validate_materialized_data"
kind = "sql"
query = "SELECT dc, COUNT(*) AS row_count, COUNT(DISTINCT instance) AS series_count, MIN(ts) AS min_ts, MAX(ts) AS max_ts FROM promql_series_rate_fusion GROUP BY dc ORDER BY dc"
warmup = 0
iterations = 1

# Offset gate control, if accepted by this pinned parser; an offset is not fused.
[[scenario.queries]]
name = "grouped_rate_sum_offset_control"
kind = "tql"
query = "TQL EVAL (1704069900, 1704071715, '15s') sum by (dc) (rate(promql_series_rate_fusion[5m] offset 15s))"
warmup = 3
iterations = 9

[scenario.queries.thresholds]
max_candidate_latency_regression_pct = 10
