# The built-in derivation conventions of the entity graph. Embedded and
# versioned with the binary (include_str!), not an operator-editable surface;
# non-standard deployments override per table with explicit
# greptime.semantic.entity.* declarations, which always win.

# Same-row co-declaration rules, open to any declaring table: a row carrying
# both entity identities witnesses `src -rel-> dst` (provenance = attribute).
co_declared_edges:
  - { src: service.instance, dst: host, rel: runs_on }
  - { src: process, dst: host, rel: runs_on }
  - { src: k8s.pod, dst: k8s.node, rel: runs_on }
  - { src: k8s.pod, dst: k8s.container, rel: contains }
  - { src: service.instance, dst: service, rel: part_of }
  - { src: k8s.pod, dst: k8s.workload, rel: part_of }
  - { src: service.instance, dst: k8s.pod, rel: runs_on }

# Same-row co-declaration rules applied only to trace sources: the RFC ties
# these edges to span structure (provenance = trace). The endpoints are
# Greptime entity types derived from GenAI semantic-convention attributes.
trace_co_declared_edges:
  - { src: gen_ai.agent, dst: gen_ai.model, rel: uses }
  - { src: gen_ai.agent, dst: gen_ai.tool, rel: invokes }

# Span-attribute columns naming an uninstrumented peer, in precedence order:
# current OTel names first (service.peer.name / db.namespace replaced the
# deprecated peer.service / db.name in semconv 1.39/1.26, kept for existing
# telemetry), the bare network endpoint last.
virtual_dst_candidates:
  - { column: span_attributes.service.peer.name, connection_type: virtual_node }
  - { column: span_attributes.peer.service, connection_type: virtual_node }
  - { column: span_attributes.db.namespace, connection_type: database }
  - { column: span_attributes.db.name, connection_type: database }
  - { column: span_attributes.server.address, connection_type: virtual_node }

# Implicit entity declarations for greptime_trace_v1 tables, applied per
# flattened resource-attribute column actually present — a table without
# k8s.pod.uid declares no pod (no name-based guessing). The pod UID is the
# bridge onto the kube-state-metrics entities below.
otlp_trace_entities:
  - entity: service
    id: [service_name]
  - entity: service.instance
    id: [service_name, resource_attributes.service.instance.id]
  - entity: k8s.pod
    id: [resource_attributes.k8s.pod.uid]
    descriptive:
      - resource_attributes.k8s.pod.name
      - resource_attributes.k8s.namespace.name

# Implicit entity declarations for Prometheus entity-descriptor metrics
# (kube-state-metrics label contracts and the compatibility-spec target_info),
# keyed by table name and gated on signal_type=metric + source=prometheus.
# Pod identity is the UID: every whitelisted pod metric carries it, OTel's
# Kubernetes conventions recommend it, and it is what lets trace-side pods
# (resource_attributes.k8s.pod.uid) and KSM-side pods land on one entity —
# names survive as descriptive attributes. k8s.workload is a Greptime
# abstraction; the owner kind is encoded in its identity.
prometheus_info_metrics:
  kube_pod_info:
    - entity: k8s.pod
      id: [uid]
      descriptive:
        - namespace
        - pod
        - node
        - host_ip
        - pod_ip
        - created_by_kind
        - created_by_name
        - priority_class
        - host_network
    - entity: k8s.node
      id: [node]
  kube_node_info:
    - entity: k8s.node
      id: [node]
      descriptive:
        - kernel_version
        - os_image
        - container_runtime_version
        - kubelet_version
        - pod_cidr
        - provider_id
        - system_uuid
        - internal_ip
  kube_pod_owner:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.workload
      id: [namespace, owner_kind, owner_name]
      descriptive: [owner_is_controller]
  kube_pod_container_info:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.container
      id: [uid, container]
      descriptive: [image, image_id, image_spec, container_id]
  kube_pod_init_container_info:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.container
      id: [uid, container]
      descriptive: [image, image_id, image_spec, container_id, restart_policy]
  kube_service_info:
    - entity: k8s.service
      id: [uid]
      descriptive:
        - namespace
        - service
        - cluster_ip
        - external_name
        - load_balancer_ip
        - external_traffic_policy
  # target_info's remaining labels are the target's resource attributes; job +
  # instance identify the target, so the snapshot belongs to the instance, not
  # the logical service.
  target_info:
    - entity: service
      id: [job]
    - entity: service.instance
      id: [job, instance]
      descriptive_rest: true
