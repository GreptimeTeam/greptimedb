# The built-in derivation conventions of the entity graph. Embedded and
# versioned with the binary (include_str!), not an operator-editable surface;
# non-standard deployments override per table with explicit
# greptime.semantic.entity.* declarations, which always win.
#
# Every `id` list is ordered broad to narrow, and that order is part of the
# identity: the id renders as the values joined in this order, so all
# declarations of one entity type must agree on it or they name two entities.

co_declared_edges:
  - { src: service.instance, dst: host, rel: runs_on }
  - { src: process, dst: host, rel: runs_on }
  - { src: k8s.pod, dst: k8s.node, rel: runs_on }
  - { src: k8s.pod, dst: k8s.container, rel: contains }
  - { src: service.instance, dst: service, rel: part_of }
  - { src: k8s.pod, dst: k8s.workload, rel: part_of }
  - { src: service.instance, dst: k8s.pod, rel: runs_on }
  - { src: service.instance, dst: container, rel: runs_on }
  - { src: container, dst: host, rel: runs_on }
  - { src: service.instance, dst: k8s.container, rel: runs_on }
  - { src: k8s.container, dst: host, rel: runs_on }

# Applied only to trace sources; the endpoints are Greptime entity types
# derived from GenAI semantic-convention attributes.
trace_co_declared_edges:
  - { src: gen_ai.agent, dst: gen_ai.model, rel: uses }
  - { src: gen_ai.agent, dst: gen_ai.tool, rel: invokes }

# Span-attribute columns naming an uninstrumented peer, in precedence order:
# current OTel names first (service.peer.name / db.namespace replaced the
# deprecated peer.service / db.name in semconv 1.39/1.26, kept for existing
# telemetry), the bare network endpoint last.
virtual_dst_candidates:
  - { column: span_attributes.service.peer.name, connection_type: virtual_node }
  - { column: span_attributes.peer.service, connection_type: virtual_node }
  - { column: span_attributes.db.namespace, connection_type: database }
  - { column: span_attributes.db.name, connection_type: database }
  - { column: span_attributes.server.address, connection_type: virtual_node }

# Implicit declarations for greptime_trace_v1 tables; the pod UID bridges
# trace-side pods onto the kube-state-metrics entities below. host.name and
# container.name vary by SDK and resource detector, so identity is the id.
# qualified_by folds the namespace into the service identity the same way the
# metric sources' `job` already carries it, so both signals name one entity.
otlp_trace_entities:
  - entity: service
    id: [service_name]
    qualified_by: resource_attributes.service.namespace
  - entity: service.instance
    id: [service_name, resource_attributes.service.instance.id]
    qualified_by: resource_attributes.service.namespace
  - entity: host
    id: [resource_attributes.host.id]
    descriptive:
      - resource_attributes.host.name
  # A container inside a pod is the k8s.container entity, under the identity
  # kube-state-metrics gives it, so the two sources name one node. The generic
  # container yields to it only on rows that produce it, or a container would
  # vanish instead of merging, and keeps its runtime id descriptive.
  #
  # Nothing checks a supersession against the edge vocabulary: whatever edges
  # the superseded type takes part in, the superseding type needs its own.
  - entity: k8s.container
    id: [resource_attributes.k8s.pod.uid, resource_attributes.k8s.container.name]
    descriptive:
      - resource_attributes.container.id
      - resource_attributes.container.name
  - entity: container
    id: [resource_attributes.container.id]
    superseded_by: k8s.container
    descriptive:
      - resource_attributes.container.name
  - entity: k8s.pod
    id: [resource_attributes.k8s.pod.uid]
    descriptive:
      - resource_attributes.k8s.pod.name
      - resource_attributes.k8s.namespace.name
  # Named, not k8s.node.uid: kube-state-metrics carries no node UID, so the
  # name is the only identity both sources can agree on. Same-named nodes in
  # different clusters therefore merge.
  - entity: k8s.node
    id: [resource_attributes.k8s.node.name]

# Implicit declarations for Prometheus entity-descriptor metrics, keyed by
# table name. Pod and service identities are the UIDs (names stay
# descriptive); k8s.workload is a Greptime abstraction with the owner kind
# encoded in its identity.
prometheus_info_metrics:
  kube_pod_info:
    - entity: k8s.pod
      id: [uid]
      descriptive:
        - namespace
        - pod
        - node
        - host_ip
        - pod_ip
        - created_by_kind
        - created_by_name
        - priority_class
        - host_network
    - entity: k8s.node
      id: [node]
  kube_node_info:
    - entity: k8s.node
      id: [node]
      descriptive:
        - kernel_version
        - os_image
        - container_runtime_version
        - kubelet_version
        - pod_cidr
        - provider_id
        - system_uuid
        - internal_ip
  kube_pod_owner:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.workload
      id: [namespace, owner_kind, owner_name]
      descriptive: [owner_is_controller]
  kube_pod_container_info:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.container
      id: [uid, container]
      descriptive: [image, image_id, image_spec, container_id]
  kube_pod_init_container_info:
    - entity: k8s.pod
      id: [uid]
      descriptive: [namespace, pod]
    - entity: k8s.container
      id: [uid, container]
      descriptive: [image, image_id, image_spec, container_id, restart_policy]
  kube_service_info:
    - entity: k8s.service
      id: [uid]
      descriptive:
        - namespace
        - service
        - cluster_ip
        - external_name
        - load_balancer_ip
        - external_traffic_policy
  # The remaining labels are the target's resource attributes: the snapshot
  # belongs to the instance, not the logical service.
  target_info:
    - entity: service
      id: [job]
    - entity: service.instance
      id: [job, instance]
      descriptive_rest: true

# Implicit declarations for the OTLP resource descriptor synthesized at
# metrics ingestion, gated on source=opentelemetry and metric.type=info.
# job/instance are the derived Prometheus-compatible identity, so services
# line up with target_info. Unlike target_info the attribute set is known, so
# descriptive columns are listed instead of swept up by descriptive_rest,
# which would misfile other entities' ids under service.instance.
otel_info_metrics:
  greptime_otel_resource_info:
    - entity: service
      id: [job]
      descriptive:
        - service.name
        - service.namespace
    - entity: service.instance
      id: [job, instance]
    - entity: host
      id: [host.id]
      descriptive:
        - host.name
    - entity: k8s.container
      id: [k8s.pod.uid, k8s.container.name]
      descriptive:
        - container.id
        - container.name
    # Yields to k8s.container, as on the trace side above. One descriptor table
    # holds both pod rows and bare-runtime rows, so the test is per row.
    - entity: container
      id: [container.id]
      superseded_by: k8s.container
      descriptive:
        - container.name
    - entity: k8s.pod
      id: [k8s.pod.uid]
      descriptive:
        - k8s.pod.name
        - k8s.namespace.name
    # Named for the same reason as on the trace side above.
    - entity: k8s.node
      id: [k8s.node.name]
