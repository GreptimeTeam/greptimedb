[package]
name = "common-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Gate for optional benchmark/test-only binaries; empty on purpose.
test = []

[[bin]]
name = "common-runtime-bin"
path = "src/bin.rs"

[[bench]]
name = "workload-scheduler-micro-bench"
path = "benches/workload_scheduler.rs"
harness = false
required-features = ["test"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
catio.workspace = true
clap.workspace = true
common-error.workspace = true
common-macro.workspace = true
common-telemetry.workspace = true
futures.workspace = true
lazy_static.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
paste.workspace = true
pin-project.workspace = true
prometheus.workspace = true
ratelimit.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[target.'cfg(tokio_unstable)'.dependencies]
tokio-metrics = { version = "0.3" }
tokio-metrics-collector = { version = "0.2" }
