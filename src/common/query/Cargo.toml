[package]
name = "common-query"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `datafusion-datasource` is only needed by `testing`, which builds the real hash-join
# fixtures. `futures-util` stays a regular dependency here because the series-frame API
# exposes `futures_util::Stream` in its public signatures.
testing = ["dep:datafusion-datasource"]

[lints]
workspace = true

[dependencies]
api.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
common-base.workspace = true
common-error.workspace = true
common-macro.workspace = true
common-recordbatch.workspace = true
common-time.workspace = true
datafusion.workspace = true
datafusion-common.workspace = true
datafusion-datasource = { workspace = true, optional = true }
datafusion-expr.workspace = true
datafusion-proto.workspace = true
datatypes.workspace = true
futures-util.workspace = true
once_cell.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
sqlparser.workspace = true
sqlparser_derive = "0.1"
store-api.workspace = true

[dev-dependencies]
common-base.workspace = true
datafusion-datasource.workspace = true
serde_json.workspace = true
tokio.workspace = true

[package.metadata.cargo-shear]
# `sqlparser` is required by `sqlparser_derive`: the generated code references
# `::sqlparser` paths, so it must stay a direct dependency.
ignored = ["sqlparser"]
