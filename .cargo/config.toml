[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"

[alias]
sqlness = "run --bin sqlness-runner --target-dir target/sqlness --"

[unstable.git]
shallow_index = true
shallow_deps = true
[unstable.gitoxide]
fetch = true
checkout = true
list_files = true
internal_use_git2 = false

# Intentionally no [env] CARGO_WORKSPACE_DIR here: src/common/version/build.rs derives
# the workspace root relative to CARGO_MANIFEST_DIR so build-script inputs stay
# checkout-relative (portable across worktrees and shared build caches). Set it
# explicitly in your environment only when this repo is built as a submodule.
