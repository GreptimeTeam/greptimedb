# Used by review_context.py before anything is pushed to the private
# review-sessions repo. The default rules miss credentials that show up in
# agent sessions as plain assignments or connection strings.

[extend]
useDefault = true

# The marker review_context.py writes in place of a secret.
[allowlist]
regexes = ['''^\[REDACTED:[a-z0-9-]+\]$''']

[[rules]]
id = "url-userinfo-password"
description = "Password in URL userinfo, e.g. postgres://user:pass@host"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^/\s:@"]+:([^/\s@"]{3,})@'''
secretGroup = 1

# Upper-case names only: `(?i)` matches JSON-escaped text such as `\ntokens: 123`.
# The optional quote after the name covers JSON keys, plain and escaped.
[[rules]]
id = "env-secret-assignment"
description = "Secret-looking environment variable assignment"
regex = '''[A-Z0-9_]*(?:PASSWORD|PASSWD|SECRET|TOKEN|API_KEY)[A-Z0-9_]*(?:\\?["'])?\s*[=:]\s*\\?["']?([^\s"'\\]{8,})'''
secretGroup = 1
