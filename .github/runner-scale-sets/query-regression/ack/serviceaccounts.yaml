# Tokenless service accounts for the query-regression-perf namespace.
#
# Kubernetes >= 1.24 does not auto-provision long-lived SA tokens; a token is
# only minted when something requests one. These SAs are therefore tokenless by
# construction: the workload pod mounts `automountServiceAccountToken: false`,
# the controller's kubeconfig identity is an external exec-plugin broker user
# (not an SA token), and nothing in this namespace requests a token. The
# `greptimedb.io/tokenless` annotation is documentation and a lint target for
# the offline policy test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: query-regression-perf
  annotations:
    greptimedb.io/tokenless: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-regression-controller
  namespace: query-regression-perf
  annotations:
    greptimedb.io/tokenless: "true"
    greptimedb.io/description: "Documentation/audit identity for the trusted controller; the live controller uses an external exec-plugin kubeconfig identity bound by rbac.yaml"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-regression-workload
  namespace: query-regression-perf
  annotations:
    greptimedb.io/tokenless: "true"
    greptimedb.io/description: "Service account referenced by the benchmark Job pod (with automountServiceAccountToken: false)"
