on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - 'config/**'
      - '**.md'
      - '.dockerignore'
      - 'docker/**'
      - '.gitignore'
      - 'grafana/**'
      - 'Makefile'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'config/**'
      - '**.md'
      - '.dockerignore'
      - 'docker/**'
      - '.gitignore'
      - 'grafana/**'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      ci_command:
        description: Internal comment-command marker
        required: false
        default: false
        type: boolean
      expected_head_sha:
        description: Head SHA verified by the CI command admission workflow
        required: false
        type: string

name: Docs CI

# To pass the required status check, see:
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks

jobs:
  verify_dispatch_head:
    name: Verify dispatched head
    runs-on: ubuntu-latest
    steps:
      - name: Verify the admitted head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_command }}
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test -n "${EXPECTED_HEAD_SHA}"
          test "${GITHUB_SHA}" = "${EXPECTED_HEAD_SHA}"

  typos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: verify_dispatch_head
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1.50.2

  license-header-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: verify_dispatch_head
    runs-on: ubuntu-latest
    name: Check License Header
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: korandoru/hawkeye@v5

  required-checks:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: verify_dispatch_head
    name: ${{ matrix.check }}
    runs-on: ubuntu-slim
    strategy:
      matrix:
        check:
          - Check
          - Rustfmt
          - Clippy
          - Unused Dependencies
          - Sqlness Test (Basic)
          - Sqlness Test (Remote WAL)
          - test
          - coverage
          - Sqlness Test (Flat format)
          - Compatibility Test (recent releases)
    steps:
      - run: 'echo "No action required"'
