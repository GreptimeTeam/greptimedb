name: Follow Up Docs
on:
  pull_request_target:
    types: [opened, edited, closed]

jobs:
  docbot:
    # An unrelated edit must not displace a pending docs checkbox change.
    if: >-
      github.event.action != 'edited' ||
      (github.event.changes.body &&
       contains(github.event.changes.body.from, '[x] This PR requires documentation updates.') !=
       contains(github.event.pull_request.body, '[x] This PR requires documentation updates.'))
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && 'close' || 'labels' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cyborg
      - name: Maybe Follow Up Docs Issue
        working-directory: cyborg
        run: pnpm tsx bin/follow-up-docs-issue.ts
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
