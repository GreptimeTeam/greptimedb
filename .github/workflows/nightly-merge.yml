# Setup and behavior: .github/nightly-merge.md
name: Nightly Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, unlabeled]
  schedule:
    # Hourly from 02:10 through 08:10 Asia/Shanghai (UTC+8), inclusive.
    # GitHub may delay scheduled runs.
    - cron: '10 0,18-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible PRs without adding them to the merge queue
        type: boolean
        default: true

permissions: {}

jobs:
  sync-label:
    if: >-
      github.repository == 'GreptimeTeam/greptimedb' && github.event_name == 'pull_request_target' &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'skip nightly merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: nightly-merge-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # On pull_request_target github.sha identifies trusted base-repository code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/nightly-merge.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { skipChecked, skipLabel } = require('./.github/scripts/nightly-merge.cjs');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main') return;
            const selected = skipChecked(pr.body);
            const labeled = pr.labels.some(item => item.name === skipLabel);
            if (selected === labeled) return;
            if (selected) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [skipLabel] });
            } else {
              // Only undo the bot's own label. A maintainer may have applied a hold since the edit.
              const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number, per_page: 100 });
              const [last] = events.filter(event => event.label?.name === skipLabel &&
                (event.event === 'labeled' || event.event === 'unlabeled'))
                .sort((a, b) => b.created_at.localeCompare(a.created_at) || b.id - a.id);
              if (last?.event === 'labeled' && last.actor?.login === 'github-actions[bot]') {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: skipLabel });
              }
            }

  enqueue:
    if: >-
      github.repository == 'GreptimeTeam/greptimedb' && github.event_name != 'pull_request_target' &&
      (vars.NIGHTLY_MERGE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: nightly-merge-enqueue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/nightly-merge.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Reuses the automation credential used by backport and compat updates.
      # A PAT (or App token) lets subsequent merge_group workflows run.
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          script: |
            const { eligibleForNightly } = require('./.github/scripts/nightly-merge.cjs');
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main',
              sort: 'created', direction: 'asc', per_page: 100
            });
            const rows = [];
            let enqueued = 0;
            for (const candidate of candidates) {
              if (enqueued >= 5) break;
              if (!eligibleForNightly(candidate)) continue;
              const number = candidate.number;
              try {
                const { repository: { pullRequest: pr } } = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        id headRefOid reviewDecision mergeStateStatus
                        mergeQueueEntry { id }
                        autoMergeRequest { enabledAt }
                      }
                    }
                  }`, { owner, repo, number });
                if (pr.mergeQueueEntry || pr.autoMergeRequest ||
                    pr.reviewDecision !== 'APPROVED' || pr.mergeStateStatus !== 'CLEAN') {
                  rows.push([String(number), 'Skipped: already queued/auto-merge enabled, or not approved and clean']);
                  continue;
                }
                let cursor = null;
                let unresolved = false;
                do {
                  const { repository: { pullRequest: { reviewThreads } } } = await github.graphql(`
                    query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            nodes { isResolved }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }`, { owner, repo, number, cursor });
                  unresolved = reviewThreads.nodes.some(thread => !thread.isResolved);
                  cursor = reviewThreads.pageInfo.hasNextPage ? reviewThreads.pageInfo.endCursor : null;
                } while (cursor && !unresolved);
                if (unresolved) {
                  rows.push([String(number), 'Skipped: unresolved review threads']);
                  continue;
                }
                // An opt-out may have arrived while checking reviews and threads.
                const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (!eligibleForNightly(current)) {
                  rows.push([String(number), 'Skipped: opted out, draft, closed, or not targeting main']);
                  continue;
                }
                if (!dryRun) {
                  // GitHub enforces branch rules; never bypass or enable auto-merge.
                  try {
                    await github.graphql(`
                    mutation($id: ID!, $sha: GitObjectID!) {
                      enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) {
                        mergeQueueEntry { id }
                      }
                    }`, { id: pr.id, sha: pr.headRefOid });
                  } catch (error) {
                    // Stacked PRs require a different API and are not handled by this workflow.
                    const stackError = 'This pull request is part of a stack and must be enqueued using the asynchronous merge REST API.';
                    if (error.errors?.length && error.errors.every(item => item.message?.startsWith(stackError))) {
                      core.warning(`PR #${number}: skipped stacked PR`);
                      rows.push([String(number), 'Skipped: stacked PR']);
                      continue;
                    }
                    throw error;
                  }
                }
                enqueued++;
                rows.push([String(number), dryRun ? 'Would enqueue' : 'Enqueued']);
              } catch (error) {
                core.warning(`PR #${number}: ${error.message}`);
                rows.push([String(number), 'Failed: see workflow logs']);
                core.setFailed('Some PRs could not be processed; see workflow logs.');
              }
            }
            for (const [number, result] of rows) core.info(`PR #${number}: ${result}`);
            await core.summary.addHeading(dryRun ? 'Nightly merge (dry run)' : 'Nightly merge')
              .addTable([['PR', 'Result'], ...rows]).write();
