name: Query Regression

# Architecture (v2): unprivileged build; trusted workflow_run controller.
# - This workflow is the UNPRIVILEGED build half. It runs on the trusted
#   local ARC runner (`perf-regression-8-cores` for PR label runs) and has no
#   ACK/cloud secret references, no kubeconfig, no kubectl cluster calls, and
#   no privileged controller job.
# - `build` resolves the immutable base/candidate SHAs, compiles the base and
#   candidate binaries plus the query regression helpers using the runner's
#   persistent build cache, runs the query regression tooling tests (build
#   context), and uploads three artifacts:
#     1. `query-regression-base-binaries`  - uploaded BEFORE any candidate-
#        controlled build step runs, so candidate build scripts cannot
#        overwrite the base binary;
#     2. `query-regression-candidate-binaries` - binaries plus the candidate
#        tests/perf tree and the candidate driver under `repo/...` (the
#        trusted controller never checks out PR code, so the payload content
#        travels inside this artifact);
#     3. `query-regression-metadata` - a strict metadata artifact containing
#        only GitHub-context values and the verified build outputs.
# - The trusted `Query Regression Controller` workflow (workflow_run follower)
#   validates the run/artifacts/PR/SHA chain from GitHub API data, treats the
#   metadata artifact as untrusted, downloads the base/candidate artifacts by
#   exact validated ids, and only then creates the one-shot ACK benchmark Job.
on:
  workflow_call:
    inputs:
      case:
        description: Query perf case path(s) in candidate checkout, all, or heavy
        required: false
        type: string
        default: all
      allow_large_fixture:
        description: Pass --allow-large-fixture to runner
        required: false
        type: boolean
        default: true
      http_timeout:
        description: Runner HTTP timeout seconds
        required: false
        type: string
        default: "300"
      base_ref:
        description: Base ref/sha to build
        required: true
        type: string
      candidate_ref:
        description: Candidate ref/sha to build; reusable release calls must provide an immutable full SHA
        required: true
        type: string
      cargo_profile:
        description: Cargo profile to build base and candidate binaries with
        required: false
        type: string
        default: nightly
      runner:
        description: Trusted local self-hosted runner label for the build job (must have the derived runner image and the persistent build cache)
        required: false
        type: string
        default: perf-regression-8-cores
    # Exact build outputs for the trusted controller's explicit release path:
    # the caller (release.yml) passes these as typed inputs to the controller
    # workflow_call, which cross-checks every one against the validated values
    # from this run. Mutable refs are never used.
    outputs:
      verified-base-sha:
        description: Immutable base SHA built by this run (job output verified-base-sha)
        value: ${{ jobs.build.outputs.verified-base-sha }}
      verified-candidate-sha:
        description: Immutable candidate SHA built by this run (job output verified-candidate-sha)
        value: ${{ jobs.build.outputs.verified-candidate-sha }}
      base-artifact-id:
        description: Artifact id of query-regression-base-binaries (job output base-artifact-id)
        value: ${{ jobs.build.outputs.base-artifact-id }}
      candidate-artifact-id:
        description: Artifact id of query-regression-candidate-binaries (job output candidate-artifact-id)
        value: ${{ jobs.build.outputs.candidate-artifact-id }}
      run-id:
        description: GitHub run id of this build run (the controller downloads artifacts by it)
        value: ${{ jobs.build.outputs.run-id }}
      run-attempt:
        description: GitHub run attempt of this build run
        value: ${{ jobs.build.outputs.run-attempt }}
  workflow_dispatch:
    inputs:
      case:
        description: Query perf case path(s) in candidate checkout, all, or heavy
        required: true
        default: all
      base_ref:
        description: Base ref/sha to build
        required: true
        default: main
      candidate_ref:
        description: Candidate ref/sha to build (empty = current ref)
        required: false
        default: ""
      allow_large_fixture:
        description: Pass --allow-large-fixture to runner
        type: boolean
        default: true
      http_timeout:
        description: Runner HTTP timeout seconds
        required: true
        default: "300"
      cargo_profile:
        description: Cargo profile to build base and candidate binaries with
        required: true
        type: choice
        default: nightly
        options:
          - nightly
          - release
          - dev
      runner:
        description: Trusted local self-hosted runner label for the build job
        required: true
        type: choice
        default: perf-regression-8-cores
        options:
          - perf-regression-8-cores
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ github.event_name != 'pull_request' ||
           (github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            (github.event.label.name == 'query-regression' ||
             github.event.label.name == 'heavy-regression')) }}
    runs-on: ${{ github.event_name != 'pull_request' && inputs.runner || 'perf-regression-8-cores' }}
    timeout-minutes: 240
    # Single-run serialization: the local scale set is maxRunners=1 and the
    # persistent build cache is single-server, so runs must not overlap.
    concurrency:
      group: query-regression-persistent-cache-v1
      queue: max
      cancel-in-progress: false
    outputs:
      verified-base-sha: ${{ steps.resolve.outputs.verified-base-sha }}
      verified-candidate-sha: ${{ steps.resolve.outputs.verified-candidate-sha }}
      base-artifact-id: ${{ steps.upload-base.outputs.artifact-id }}
      candidate-artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      # The controller's release path downloads artifacts from THIS run by the
      # exact run id/attempt (never a mutable ref).
      run-id: ${{ github.run_id }}
      run-attempt: ${{ github.run_attempt }}
    env:
      CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'nightly' || inputs.cargo_profile }}
      # The local runner image/pod provides CARGO_HOME, CARGO_TARGET_DIR,
      # RUSTUP_HOME/RUSTUP_TOOLCHAIN, RUSTC_WRAPPER/sccache, and
      # CARGO_INCREMENTAL; only the mold RUSTFLAGS are set here.
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      CANDIDATE_REF: ${{ github.event_name != 'pull_request' && (inputs.candidate_ref || github.ref) || '' }}
      EVENT_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout base source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_REF }}
          path: src
          persist-credentials: false

      - name: Resolve immutable candidate and build base
        id: resolve
        working-directory: src
        shell: bash
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFINING_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail

          fail_closed() {
            printf '%s\n' \
              "PR changed or merge result unavailable; maintainer must remove and re-add the regression label after reviewing current revision. $1" >&2
            exit 1
          }

          is_full_sha() {
            [[ "$1" =~ ^[[:xdigit:]]{40}$ ]]
          }

          is_reusable_call=false
          if [[ "${CALLER_WORKFLOW_REF}" != "${DEFINING_WORKFLOW_REF}" ]]; then
            is_reusable_call=true
          fi

          fetch_with_retry() {
            local ref="$1"
            local depth="$2"
            local attempt=1
            local max_attempts=5
            local delay

            while (( attempt <= max_attempts )); do
              if git fetch --no-tags --prune --depth="${depth}" origin "${ref}"; then
                return 0
              fi
              printf 'Git fetch failed for %s (attempt %d/%d).\n' \
                "${ref}" "${attempt}" "${max_attempts}" >&2
              if (( attempt < max_attempts )); then
                delay=$(( 2 ** (attempt - 1) ))
                printf 'Retrying git fetch for %s in %d seconds.\n' "${ref}" "${delay}" >&2
                sleep "${delay}"
              fi
              ((attempt += 1))
            done
            return 1
          }

          initially_checked_out_base_sha="$(git rev-parse --verify HEAD)"
          is_full_sha "${initially_checked_out_base_sha}" || {
            printf 'Could not resolve initially checked-out BASE_REF commit.\n' >&2
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            for identity in EVENT_MERGE_SHA EVENT_HEAD_SHA EVENT_BASE_SHA; do
              value="${!identity-}"
              is_full_sha "${value}" || fail_closed "Missing or invalid ${identity}."
            done

            if ! fetch_with_retry "${EVENT_MERGE_SHA}" 2; then
              fail_closed "Could not fetch event merge SHA ${EVENT_MERGE_SHA}."
            fi
            fetched_sha="$(git rev-parse --verify FETCH_HEAD 2>/dev/null)" \
              || fail_closed "Fetched event merge SHA could not be resolved."
            [[ "${fetched_sha,,}" == "${EVENT_MERGE_SHA,,}" ]] \
              || fail_closed "FETCH_HEAD ${fetched_sha} does not match event merge SHA ${EVENT_MERGE_SHA}."

            read -r -a parents <<< "$(git show -s --format=%P FETCH_HEAD)"
            (( ${#parents[@]} == 2 )) \
              || fail_closed "Event merge SHA ${EVENT_MERGE_SHA} is not a two-parent merge commit."
            head_parent_count=0
            for parent in "${parents[@]}"; do
              if [[ "${parent,,}" == "${EVENT_HEAD_SHA,,}" ]]; then
                ((head_parent_count += 1))
              else
                VERIFIED_BASE_SHA="${parent,,}"
              fi
            done
            (( head_parent_count == 1 )) \
              || fail_closed "Event merge SHA must have exactly one EVENT_HEAD_SHA parent."
            is_full_sha "${VERIFIED_BASE_SHA-}" \
              || fail_closed "Event merge SHA has no non-head parent for the base build."
            VERIFIED_CANDIDATE_SHA="${fetched_sha,,}"
          else
            if [[ "${is_reusable_call}" == true ]] && ! is_full_sha "${CANDIDATE_REF}"; then
              printf 'Reusable calls require CANDIDATE_REF to be an immutable full SHA, got: %s\n' \
                "${CANDIDATE_REF}" >&2
              exit 1
            fi
            if ! fetch_with_retry "${CANDIDATE_REF}" 1; then
              printf 'Could not fetch candidate ref %s.\n' "${CANDIDATE_REF}" >&2
              exit 1
            fi
            fetched_sha="$(git rev-parse --verify FETCH_HEAD)"
            if { [[ "${is_reusable_call}" == true ]] || is_full_sha "${CANDIDATE_REF}"; } && \
              [[ "${fetched_sha,,}" != "${CANDIDATE_REF,,}" ]]; then
              printf 'FETCH_HEAD %s does not match immutable candidate SHA %s.\n' \
                "${fetched_sha}" "${CANDIDATE_REF}" >&2
              exit 1
            fi
            VERIFIED_CANDIDATE_SHA="${fetched_sha}"
            VERIFIED_BASE_SHA="${initially_checked_out_base_sha}"
          fi

          is_full_sha "${VERIFIED_CANDIDATE_SHA}" || {
            printf 'Could not resolve candidate SHA.\n' >&2
            exit 1
          }
          is_full_sha "${VERIFIED_BASE_SHA}" || {
            printf 'Could not resolve build base SHA.\n' >&2
            exit 1
          }
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "${VERIFIED_CANDIDATE_SHA,,}" >> "${GITHUB_ENV}"
          printf 'VERIFIED_BASE_SHA=%s\n' "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_ENV}"
          # Real job outputs: the trusted controller consumes exactly these
          # values (via the metadata artifact and its own validation).
          printf 'verified-base-sha=%s\n' "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_OUTPUT}"
          printf 'verified-candidate-sha=%s\n' "${VERIFIED_CANDIDATE_SHA,,}" >> "${GITHUB_OUTPUT}"
          printf 'Verified candidate SHA: %s\n' "${VERIFIED_CANDIDATE_SHA,,}"
          printf 'Verified build base SHA: %s\n' "${VERIFIED_BASE_SHA,,}"
          printf -- '- Verified candidate SHA: `%s`; built base SHA: `%s`\n' \
            "${VERIFIED_CANDIDATE_SHA,,}" "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_STEP_SUMMARY}"
          git reset --hard "${VERIFIED_BASE_SHA}"
          git clean -ffdx

      - name: Verify build toolchain (runner image contract)
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "1001" || { printf 'Runner must run as UID 1001.\n' >&2; exit 1; }
          for tool in cargo rustc rustup protoc mold clang cmake sccache; do
            command -v "${tool}" >/dev/null 2>&1 || {
              printf 'Missing build tool on the local runner: %s\n' "${tool}" >&2
              exit 1
            }
          done
          protoc --version | grep -q '3\.21\.12' || { printf 'protoc version mismatch (need libprotoc 3.21.12).\n' >&2; exit 1; }
          mold --version | grep -q '2\.30\.0' || { printf 'mold version mismatch (need 2.30.0).\n' >&2; exit 1; }
          sccache --version | grep -q '0\.16\.0' || { printf 'sccache version mismatch (need 0.16.0).\n' >&2; exit 1; }
          rustup --version | grep -q '1\.29\.0' || { printf 'rustup version mismatch (need 1.29.0).\n' >&2; exit 1; }
          case "$(rustup show active-toolchain)" in
            nightly-2026-03-21-*) ;;
            *) printf 'Unexpected active Rust toolchain: %s\n' "$(rustup show active-toolchain)" >&2; exit 1 ;;
          esac
          test ! -w /opt/rustup || { printf '/opt/rustup must be image-owned and non-writable.\n' >&2; exit 1; }
          test ! -w /opt/cargo/bin || { printf '/opt/cargo/bin must be image-owned and non-writable.\n' >&2; exit 1; }
          case "$(command -v cargo)" in
            /opt/cargo/bin/*) ;;
            *) printf 'cargo must resolve from /opt/cargo/bin.\n' >&2; exit 1 ;;
          esac

      - name: Disk preflight
        shell: bash
        run: |
          set -euo pipefail
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          printf 'Available disk space on /: %s KiB\n' "${free_kib}"
          if (( free_kib < 25 * 1024 * 1024 )); then
            printf 'Insufficient disk space on the local runner: %s KiB available, need at least 25 GiB.\n' "${free_kib}" >&2
            exit 1
          fi

      - name: Build base greptime
        working-directory: src
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin greptime
          base_build_elapsed="${SECONDS}"
          printf 'Base greptime cargo build elapsed: %s seconds\n' "${base_build_elapsed}"
          printf -- '- Base greptime cargo build: %s seconds\n' "${base_build_elapsed}" >> "${GITHUB_STEP_SUMMARY}"
          target_dir="${CARGO_PROFILE}"
          if [[ "${CARGO_PROFILE}" == "dev" ]]; then
            target_dir="debug"
          fi
          mkdir -p "${GITHUB_WORKSPACE}/query-regression-bins/base"
          cp "${CARGO_TARGET_DIR}/${target_dir}/greptime" \
            "${GITHUB_WORKSPACE}/query-regression-bins/base/greptime"

      - name: Stage base artifact
        shell: bash
        run: |
          set -euo pipefail
          # The base artifact is staged and uploaded BEFORE any candidate-
          # controlled build step runs: candidate build scripts cannot
          # overwrite the base binary after it is immutable in Actions.
          artifact_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/base"
          mkdir -p "${artifact_dir}/query-regression-bins/base"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/base/greptime" \
            "${artifact_dir}/query-regression-bins/base/greptime"
          cd "${artifact_dir}"
          python3 - "${VERIFIED_BASE_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          base_sha = sys.argv[1]
          path = "query-regression-bins/base/greptime"
          digest = subprocess.check_output(["sha256sum", path], text=True).split()[0]
          manifest = {"base_sha": base_sha, "binaries": [{"path": path, "sha256": digest}]}
          with open("base-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          test -s base-manifest.json

      - name: Upload query regression base binaries
        id: upload-base
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-base-binaries
          path: query-regression-artifacts/base/**
          if-no-files-found: error
          retention-days: 7

      - name: Switch source to candidate
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFIED_CANDIDATE_SHA}" =~ ^[[:xdigit:]]{40}$ ]] || {
            printf 'Verified candidate SHA is missing or invalid.\n' >&2
            exit 1
          }
          git cat-file -e "${VERIFIED_CANDIDATE_SHA}^{commit}" || {
            printf 'Verified candidate SHA is unavailable in the local repository.\n' >&2
            exit 1
          }
          git reset --hard "${VERIFIED_CANDIDATE_SHA}"
          git clean -ffdx

      - name: Build candidate greptime and query regression helpers
        working-directory: src
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin greptime
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin query_perf_fixture --features dev-tools
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin query_regression_runner --features dev-tools
          candidate_build_elapsed="${SECONDS}"
          printf 'Candidate greptime and query regression helper cargo builds elapsed: %s seconds\n' "${candidate_build_elapsed}"
          printf -- '- Candidate greptime and query regression helper cargo builds: %s seconds\n' "${candidate_build_elapsed}" >> "${GITHUB_STEP_SUMMARY}"
          target_dir="${CARGO_PROFILE}"
          if [[ "${CARGO_PROFILE}" == "dev" ]]; then
            target_dir="debug"
          fi
          mkdir -p "${GITHUB_WORKSPACE}/query-regression-bins/candidate"
          cp "${CARGO_TARGET_DIR}/${target_dir}/greptime" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/greptime"
          cp "${CARGO_TARGET_DIR}/${target_dir}/query_perf_fixture" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_perf_fixture"
          cp "${CARGO_TARGET_DIR}/${target_dir}/query_regression_runner" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_regression_runner"

      - name: Run query regression tooling tests (build context, no ACK credentials)
        working-directory: src
        run: |
          set -euo pipefail
          # Tooling tests execute candidate Python in the build job only — the
          # same trust context as compiling the candidate itself. They never
          # run on the ACK cluster (ACK runs performance regression only) and
          # never in the controller workflow (which holds the ACK kubeconfig).
          uv run --no-project python tests/perf/test_query_regression_runner_compaction_toctou.py
          uv run --no-project python tests/perf/test_query_regression_runner_otlp_trace_load.py
          uv run --no-project python tests/perf/test_query_regression_summary_otlp.py
          uv run --no-project python tests/perf/test_query_regression_case_selection.py

      - name: Stage candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/candidate"
          mkdir -p "${artifact_dir}/query-regression-bins/candidate"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/greptime" \
            "${artifact_dir}/query-regression-bins/candidate/greptime"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_perf_fixture" \
            "${artifact_dir}/query-regression-bins/candidate/query_perf_fixture"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_regression_runner" \
            "${artifact_dir}/query-regression-bins/candidate/query_regression_runner"
          # The trusted controller never checks out PR code, so the candidate
          # tests/perf tree and the candidate driver travel inside this
          # artifact (under repo/...) for the ACK payload.
          mkdir -p "${artifact_dir}/repo/tests" "${artifact_dir}/repo/.github/scripts"
          cp -a "${GITHUB_WORKSPACE}/src/tests/perf" "${artifact_dir}/repo/tests/"
          cp "${GITHUB_WORKSPACE}/src/.github/scripts/query-regression-run.py" \
            "${artifact_dir}/repo/.github/scripts/query-regression-run.py"
          cd "${artifact_dir}"
          python3 - "${VERIFIED_CANDIDATE_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          candidate_sha = sys.argv[1]
          binary_paths = [
              "query-regression-bins/candidate/greptime",
              "query-regression-bins/candidate/query_perf_fixture",
              "query-regression-bins/candidate/query_regression_runner",
          ]
          binaries = []
          for path in binary_paths:
              digest = subprocess.check_output(["sha256sum", path], text=True).split()[0]
              binaries.append({"path": path, "sha256": digest})
          manifest = {"candidate_sha": candidate_sha, "binaries": binaries}
          with open("candidate-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          test -s candidate-manifest.json

      - name: Upload query regression candidate binaries
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-candidate-binaries
          path: query-regression-artifacts/candidate/**
          if-no-files-found: error
          retention-days: 7

      - name: Stage strict query regression metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          BASE_ARTIFACT_ID: ${{ steps.upload-base.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          CASE_PATHS_INPUT: ${{ github.event_name == 'pull_request' && '' || inputs.case }}
        shell: bash
        run: |
          set -euo pipefail
          # The strict metadata artifact carries ONLY GitHub-context values and
          # the verified build outputs (step outputs of the upload steps). It
          # is treated as untrusted by the controller and every field is
          # cross-checked against the GitHub API there. Candidate-controlled
          # build steps run before this step, so the file is always rewritten
          # here from env/step outputs before the upload below.
          metadata_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/metadata"
          mkdir -p "${metadata_dir}"
          python3 - <<'PY' > "${metadata_dir}/query-regression-metadata.json"
          import json
          import os

          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "pull_request":
              pr_number = int(os.environ["PR_NUMBER"])
              head_sha = os.environ["EVENT_HEAD_SHA"]
              event_base_sha = os.environ["EVENT_BASE_SHA"]
              head_repo = os.environ["HEAD_REPO"]
              base_repo = os.environ["BASE_REPO"]
              label = os.environ.get("LABEL_NAME", "")
          else:
              pr_number = None
              head_sha = os.environ["GITHUB_SHA"]
              event_base_sha = os.environ.get("BASE_REF", "") or None
              head_repo = os.environ["GITHUB_REPOSITORY"]
              base_repo = os.environ["GITHUB_REPOSITORY"]
              label = None

          if event == "pull_request":
              case_paths = "heavy" if label == "heavy-regression" else "all"
          else:
              case_paths = os.environ.get("CASE_PATHS_INPUT", "all")

          metadata = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": event,
              "pr_number": pr_number,
              "head_sha": head_sha,
              "event_base_sha": event_base_sha,
              "head_repo": head_repo,
              "base_repo": base_repo,
              "label": label,
              "case": case_paths,
              "built_base_sha": os.environ["VERIFIED_BASE_SHA"],
              "candidate_sha": os.environ["VERIFIED_CANDIDATE_SHA"],
              "base_artifact_id": int(os.environ["BASE_ARTIFACT_ID"]),
              "candidate_artifact_id": int(os.environ["CANDIDATE_ARTIFACT_ID"]),
          }
          print(json.dumps(metadata, sort_keys=True))
          PY
          test -s "${metadata_dir}/query-regression-metadata.json"

      - name: Upload query regression metadata
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-metadata
          path: query-regression-artifacts/metadata/**
          if-no-files-found: error
          retention-days: 7
