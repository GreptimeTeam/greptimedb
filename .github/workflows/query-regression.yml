name: Query Regression

# Architecture (v1): trusted local controller; perf in a one-shot ACK Job.
# - `build` runs on the trusted local self-hosted runner
#   (`perf-regression-8-cores`): it resolves the immutable base/candidate
#   SHAs, compiles the base and candidate binaries plus the query regression
#   helpers using the runner's persistent build cache, and uploads base and
#   candidate binaries as two separate immutable artifacts. The base artifact
#   is uploaded BEFORE any candidate-controlled build step runs, so candidate
#   build scripts cannot overwrite the base binary. The verified SHAs and the
#   artifact IDs are exposed as build job outputs. No ACK credential is
#   present in this job; the query regression tooling tests run here (build
#   context), not on ACK.
# - `query-regression-controller` runs on the same trusted local runner: it
#   restores the trusted scripts (controller/summary/pr-metadata) from the
#   verified base commit into a fresh $RUNNER_TEMP directory (never from the
#   build artifact), downloads both artifacts by exact artifact ID, verifies
#   the binary attestation and that the manifests agree with the verified
#   SHAs and the candidate checkout HEAD, then executes the restored trusted
#   controller script. The controller creates a deterministic one-shot
#   Kubernetes Job in the ACK cluster, transfers the verified payload into
#   the running pod with `kubectl cp` (never executing candidate content on
#   the runner), waits for the benchmark, collects and validates the
#   reports/summary, and deletes the exact Job with bounded retries plus an
#   absence check. The pod has no GitHub/cloud/kube credentials and runs the
#   performance regression only. ACK nodepool autoscaling is implicit: the
#   Pending pod scales the dedicated nodepool up, deletion scales it down; no
#   nodepool API is ever called.
on:
  workflow_call:
    inputs:
      case:
        description: Query perf case path(s) in candidate checkout, all, or heavy
        required: false
        type: string
        default: all
      allow_large_fixture:
        description: Pass --allow-large-fixture to runner
        required: false
        type: boolean
        default: true
      http_timeout:
        description: Runner HTTP timeout seconds
        required: false
        type: string
        default: "300"
      base_ref:
        description: Base ref/sha to build
        required: true
        type: string
      candidate_ref:
        description: Candidate ref/sha to build; reusable release calls must provide an immutable full SHA
        required: true
        type: string
      cargo_profile:
        description: Cargo profile to build base and candidate binaries with
        required: false
        type: string
        default: nightly
      runner:
        description: Trusted local self-hosted runner label for the build and controller jobs (must have the derived runner image, kubectl, and ACK kubeconfig access)
        required: false
        type: string
        default: perf-regression-8-cores
  workflow_dispatch:
    inputs:
      case:
        description: Query perf case path(s) in candidate checkout, all, or heavy
        required: true
        default: all
      base_ref:
        description: Base ref/sha to build
        required: true
        default: main
      candidate_ref:
        description: Candidate ref/sha to build (empty = current ref)
        required: false
        default: ""
      allow_large_fixture:
        description: Pass --allow-large-fixture to runner
        type: boolean
        default: true
      http_timeout:
        description: Runner HTTP timeout seconds
        required: true
        default: "300"
      cargo_profile:
        description: Cargo profile to build base and candidate binaries with
        required: true
        type: choice
        default: nightly
        options:
          - nightly
          - release
          - dev
      runner:
        description: Trusted local self-hosted runner label for the build and controller jobs (must have the derived runner image, kubectl, and ACK kubeconfig access)
        required: true
        type: choice
        default: perf-regression-8-cores
        options:
          - perf-regression-8-cores
  pull_request:
    types: [labeled]

permissions:
  contents: read
  # Required by actions/download-artifact@v4 to fetch artifacts by exact ID.
  actions: read

jobs:
  build:
    if: >-
      ${{ github.event_name != 'pull_request' ||
           (github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            (github.event.label.name == 'query-regression' ||
             github.event.label.name == 'heavy-regression')) }}
    runs-on: ${{ github.event_name != 'pull_request' && inputs.runner || 'perf-regression-8-cores' }}
    timeout-minutes: 240
    # Single-run serialization: the local scale set is maxRunners=1 and the
    # persistent build cache is single-server, so runs must not overlap.
    concurrency:
      group: query-regression-persistent-cache-v1
      queue: max
      cancel-in-progress: false
    outputs:
      verified-base-sha: ${{ steps.resolve.outputs.verified-base-sha }}
      verified-candidate-sha: ${{ steps.resolve.outputs.verified-candidate-sha }}
      base-artifact-id: ${{ steps.upload-base.outputs.artifact-id }}
      candidate-artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
    env:
      CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'nightly' || inputs.cargo_profile }}
      # The local runner image/pod provides CARGO_HOME, CARGO_TARGET_DIR,
      # RUSTUP_HOME/RUSTUP_TOOLCHAIN, RUSTC_WRAPPER/sccache, and
      # CARGO_INCREMENTAL; only the mold RUSTFLAGS are set here.
      RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=mold
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      CANDIDATE_REF: ${{ github.event_name != 'pull_request' && (inputs.candidate_ref || github.ref) || '' }}
      EVENT_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout base source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_REF }}
          path: src
          persist-credentials: false

      - name: Resolve immutable candidate and build base
        id: resolve
        working-directory: src
        shell: bash
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFINING_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail

          fail_closed() {
            printf '%s\n' \
              "PR changed or merge result unavailable; maintainer must remove and re-add the regression label after reviewing current revision. $1" >&2
            exit 1
          }

          is_full_sha() {
            [[ "$1" =~ ^[[:xdigit:]]{40}$ ]]
          }

          is_reusable_call=false
          if [[ "${CALLER_WORKFLOW_REF}" != "${DEFINING_WORKFLOW_REF}" ]]; then
            is_reusable_call=true
          fi

          fetch_with_retry() {
            local ref="$1"
            local depth="$2"
            local attempt=1
            local max_attempts=5
            local delay

            while (( attempt <= max_attempts )); do
              if git fetch --no-tags --prune --depth="${depth}" origin "${ref}"; then
                return 0
              fi
              printf 'Git fetch failed for %s (attempt %d/%d).\n' \
                "${ref}" "${attempt}" "${max_attempts}" >&2
              if (( attempt < max_attempts )); then
                delay=$(( 2 ** (attempt - 1) ))
                printf 'Retrying git fetch for %s in %d seconds.\n' "${ref}" "${delay}" >&2
                sleep "${delay}"
              fi
              ((attempt += 1))
            done
            return 1
          }

          initially_checked_out_base_sha="$(git rev-parse --verify HEAD)"
          is_full_sha "${initially_checked_out_base_sha}" || {
            printf 'Could not resolve initially checked-out BASE_REF commit.\n' >&2
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            for identity in EVENT_MERGE_SHA EVENT_HEAD_SHA EVENT_BASE_SHA; do
              value="${!identity-}"
              is_full_sha "${value}" || fail_closed "Missing or invalid ${identity}."
            done

            if ! fetch_with_retry "${EVENT_MERGE_SHA}" 2; then
              fail_closed "Could not fetch event merge SHA ${EVENT_MERGE_SHA}."
            fi
            fetched_sha="$(git rev-parse --verify FETCH_HEAD 2>/dev/null)" \
              || fail_closed "Fetched event merge SHA could not be resolved."
            [[ "${fetched_sha,,}" == "${EVENT_MERGE_SHA,,}" ]] \
              || fail_closed "FETCH_HEAD ${fetched_sha} does not match event merge SHA ${EVENT_MERGE_SHA}."

            read -r -a parents <<< "$(git show -s --format=%P FETCH_HEAD)"
            (( ${#parents[@]} == 2 )) \
              || fail_closed "Event merge SHA ${EVENT_MERGE_SHA} is not a two-parent merge commit."
            head_parent_count=0
            for parent in "${parents[@]}"; do
              if [[ "${parent,,}" == "${EVENT_HEAD_SHA,,}" ]]; then
                ((head_parent_count += 1))
              else
                VERIFIED_BASE_SHA="${parent,,}"
              fi
            done
            (( head_parent_count == 1 )) \
              || fail_closed "Event merge SHA must have exactly one EVENT_HEAD_SHA parent."
            is_full_sha "${VERIFIED_BASE_SHA-}" \
              || fail_closed "Event merge SHA has no non-head parent for the base build."
            VERIFIED_CANDIDATE_SHA="${fetched_sha,,}"
          else
            if [[ "${is_reusable_call}" == true ]] && ! is_full_sha "${CANDIDATE_REF}"; then
              printf 'Reusable calls require CANDIDATE_REF to be an immutable full SHA, got: %s\n' \
                "${CANDIDATE_REF}" >&2
              exit 1
            fi
            if ! fetch_with_retry "${CANDIDATE_REF}" 1; then
              printf 'Could not fetch candidate ref %s.\n' "${CANDIDATE_REF}" >&2
              exit 1
            fi
            fetched_sha="$(git rev-parse --verify FETCH_HEAD)"
            if { [[ "${is_reusable_call}" == true ]] || is_full_sha "${CANDIDATE_REF}"; } && \
              [[ "${fetched_sha,,}" != "${CANDIDATE_REF,,}" ]]; then
              printf 'FETCH_HEAD %s does not match immutable candidate SHA %s.\n' \
                "${fetched_sha}" "${CANDIDATE_REF}" >&2
              exit 1
            fi
            VERIFIED_CANDIDATE_SHA="${fetched_sha}"
            VERIFIED_BASE_SHA="${initially_checked_out_base_sha}"
          fi

          is_full_sha "${VERIFIED_CANDIDATE_SHA}" || {
            printf 'Could not resolve candidate SHA.\n' >&2
            exit 1
          }
          is_full_sha "${VERIFIED_BASE_SHA}" || {
            printf 'Could not resolve build base SHA.\n' >&2
            exit 1
          }
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "${VERIFIED_CANDIDATE_SHA,,}" >> "${GITHUB_ENV}"
          printf 'VERIFIED_BASE_SHA=%s\n' "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_ENV}"
          # Real job outputs: the controller job consumes exactly these values.
          printf 'verified-base-sha=%s\n' "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_OUTPUT}"
          printf 'verified-candidate-sha=%s\n' "${VERIFIED_CANDIDATE_SHA,,}" >> "${GITHUB_OUTPUT}"
          printf 'Verified candidate SHA: %s\n' "${VERIFIED_CANDIDATE_SHA,,}"
          printf 'Verified build base SHA: %s\n' "${VERIFIED_BASE_SHA,,}"
          printf -- '- Verified candidate SHA: `%s`; built base SHA: `%s`\n' \
            "${VERIFIED_CANDIDATE_SHA,,}" "${VERIFIED_BASE_SHA,,}" >> "${GITHUB_STEP_SUMMARY}"
          git reset --hard "${VERIFIED_BASE_SHA}"
          git clean -ffdx

      - name: Verify build toolchain (runner image contract)
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = "1001" || { printf 'Runner must run as UID 1001.\n' >&2; exit 1; }
          for tool in cargo rustc rustup protoc mold clang cmake sccache; do
            command -v "${tool}" >/dev/null 2>&1 || {
              printf 'Missing build tool on the local runner: %s\n' "${tool}" >&2
              exit 1
            }
          done
          protoc --version | grep -q '3\.21\.12' || { printf 'protoc version mismatch (need libprotoc 3.21.12).\n' >&2; exit 1; }
          mold --version | grep -q '2\.30\.0' || { printf 'mold version mismatch (need 2.30.0).\n' >&2; exit 1; }
          sccache --version | grep -q '0\.16\.0' || { printf 'sccache version mismatch (need 0.16.0).\n' >&2; exit 1; }
          rustup --version | grep -q '1\.29\.0' || { printf 'rustup version mismatch (need 1.29.0).\n' >&2; exit 1; }
          case "$(rustup show active-toolchain)" in
            nightly-2026-03-21-*) ;;
            *) printf 'Unexpected active Rust toolchain: %s\n' "$(rustup show active-toolchain)" >&2; exit 1 ;;
          esac
          test ! -w /opt/rustup || { printf '/opt/rustup must be image-owned and non-writable.\n' >&2; exit 1; }
          test ! -w /opt/cargo/bin || { printf '/opt/cargo/bin must be image-owned and non-writable.\n' >&2; exit 1; }
          case "$(command -v cargo)" in
            /opt/cargo/bin/*) ;;
            *) printf 'cargo must resolve from /opt/cargo/bin.\n' >&2; exit 1 ;;
          esac

      - name: Disk preflight
        shell: bash
        run: |
          set -euo pipefail
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          printf 'Available disk space on /: %s KiB\n' "${free_kib}"
          if (( free_kib < 25 * 1024 * 1024 )); then
            printf 'Insufficient disk space on the local runner: %s KiB available, need at least 25 GiB.\n' "${free_kib}" >&2
            exit 1
          fi

      - name: Build base greptime
        working-directory: src
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin greptime
          base_build_elapsed="${SECONDS}"
          printf 'Base greptime cargo build elapsed: %s seconds\n' "${base_build_elapsed}"
          printf -- '- Base greptime cargo build: %s seconds\n' "${base_build_elapsed}" >> "${GITHUB_STEP_SUMMARY}"
          target_dir="${CARGO_PROFILE}"
          if [[ "${CARGO_PROFILE}" == "dev" ]]; then
            target_dir="debug"
          fi
          mkdir -p "${GITHUB_WORKSPACE}/query-regression-bins/base"
          cp "${CARGO_TARGET_DIR}/${target_dir}/greptime" \
            "${GITHUB_WORKSPACE}/query-regression-bins/base/greptime"

      - name: Stage base artifact
        shell: bash
        run: |
          set -euo pipefail
          # The base artifact is staged and uploaded BEFORE any candidate-
          # controlled build step runs: candidate build scripts cannot
          # overwrite the base binary after it is immutable in Actions.
          artifact_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/base"
          mkdir -p "${artifact_dir}/query-regression-bins/base"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/base/greptime" \
            "${artifact_dir}/query-regression-bins/base/greptime"
          cd "${artifact_dir}"
          python3 - "${VERIFIED_BASE_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          base_sha = sys.argv[1]
          path = "query-regression-bins/base/greptime"
          digest = subprocess.check_output(["sha256sum", path], text=True).split()[0]
          manifest = {"base_sha": base_sha, "binaries": [{"path": path, "sha256": digest}]}
          with open("base-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          test -s base-manifest.json

      - name: Upload query regression base binaries
        id: upload-base
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-base-binaries
          path: query-regression-artifacts/base/**
          if-no-files-found: error
          retention-days: 7

      - name: Switch source to candidate
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFIED_CANDIDATE_SHA}" =~ ^[[:xdigit:]]{40}$ ]] || {
            printf 'Verified candidate SHA is missing or invalid.\n' >&2
            exit 1
          }
          git cat-file -e "${VERIFIED_CANDIDATE_SHA}^{commit}" || {
            printf 'Verified candidate SHA is unavailable in the local repository.\n' >&2
            exit 1
          }
          git reset --hard "${VERIFIED_CANDIDATE_SHA}"
          git clean -ffdx

      - name: Build candidate greptime and query regression helpers
        working-directory: src
        run: |
          set -euo pipefail
          SECONDS=0
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin greptime
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin query_perf_fixture --features dev-tools
          cargo build --profile "${CARGO_PROFILE}" -p cmd --bin query_regression_runner --features dev-tools
          candidate_build_elapsed="${SECONDS}"
          printf 'Candidate greptime and query regression helper cargo builds elapsed: %s seconds\n' "${candidate_build_elapsed}"
          printf -- '- Candidate greptime and query regression helper cargo builds: %s seconds\n' "${candidate_build_elapsed}" >> "${GITHUB_STEP_SUMMARY}"
          target_dir="${CARGO_PROFILE}"
          if [[ "${CARGO_PROFILE}" == "dev" ]]; then
            target_dir="debug"
          fi
          mkdir -p "${GITHUB_WORKSPACE}/query-regression-bins/candidate"
          cp "${CARGO_TARGET_DIR}/${target_dir}/greptime" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/greptime"
          cp "${CARGO_TARGET_DIR}/${target_dir}/query_perf_fixture" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_perf_fixture"
          cp "${CARGO_TARGET_DIR}/${target_dir}/query_regression_runner" \
            "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_regression_runner"

      - name: Run query regression tooling tests (build context, no ACK credentials)
        working-directory: src
        run: |
          set -euo pipefail
          # Tooling tests execute candidate Python in the build job only — the
          # same trust context as compiling the candidate itself. They never
          # run on the ACK cluster (ACK runs performance regression only) and
          # never in the controller job (which holds the ACK kubeconfig).
          uv run --no-project python tests/perf/test_query_regression_runner_compaction_toctou.py
          uv run --no-project python tests/perf/test_query_regression_runner_otlp_trace_load.py
          uv run --no-project python tests/perf/test_query_regression_summary_otlp.py
          uv run --no-project python tests/perf/test_query_regression_case_selection.py

      - name: Stage candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/candidate"
          mkdir -p "${artifact_dir}/query-regression-bins/candidate"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/greptime" \
            "${artifact_dir}/query-regression-bins/candidate/greptime"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_perf_fixture" \
            "${artifact_dir}/query-regression-bins/candidate/query_perf_fixture"
          cp "${GITHUB_WORKSPACE}/query-regression-bins/candidate/query_regression_runner" \
            "${artifact_dir}/query-regression-bins/candidate/query_regression_runner"
          cd "${artifact_dir}"
          python3 - "${VERIFIED_CANDIDATE_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          candidate_sha = sys.argv[1]
          binary_paths = [
              "query-regression-bins/candidate/greptime",
              "query-regression-bins/candidate/query_perf_fixture",
              "query-regression-bins/candidate/query_regression_runner",
          ]
          binaries = []
          for path in binary_paths:
              digest = subprocess.check_output(["sha256sum", path], text=True).split()[0]
              binaries.append({"path": path, "sha256": digest})
          manifest = {"candidate_sha": candidate_sha, "binaries": binaries}
          with open("candidate-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          test -s candidate-manifest.json

      - name: Upload query regression candidate binaries
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-candidate-binaries
          path: query-regression-artifacts/candidate/**
          if-no-files-found: error
          retention-days: 7

  query-regression-controller:
    if: >-
      ${{ github.event_name != 'pull_request' ||
           (github.event_name == 'pull_request' &&
            !github.event.pull_request.draft &&
            (github.event.label.name == 'query-regression' ||
             github.event.label.name == 'heavy-regression')) }}
    needs: build
    runs-on: ${{ github.event_name != 'pull_request' && inputs.runner || 'perf-regression-8-cores' }}
    timeout-minutes: 180
    concurrency:
      group: query-regression-persistent-cache-v1
      queue: max
      cancel-in-progress: false
    env:
      # Verified SHAs and artifact IDs come from the build job outputs only —
      # never re-derived from the PR head or any other independent source.
      VERIFIED_BASE_SHA: ${{ needs.build.outputs.verified-base-sha }}
      VERIFIED_CANDIDATE_SHA: ${{ needs.build.outputs.verified-candidate-sha }}
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      CANDIDATE_REF: ${{ github.event_name != 'pull_request' && (inputs.candidate_ref || github.ref) || '' }}
      EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      CASE_PATHS: ${{ github.event_name == 'pull_request' && (github.event.label.name == 'heavy-regression' && 'heavy' || 'all') || inputs.case }}
      HTTP_TIMEOUT: ${{ github.event_name == 'pull_request' && '300' || inputs.http_timeout }}
      ALLOW_LARGE_FIXTURE: ${{ github.event_name == 'pull_request' && 'true' || inputs.allow_large_fixture }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CASE_NAME: ${{ github.event_name == 'pull_request' && (github.event.label.name == 'heavy-regression' && 'heavy case set' || 'default case set') || inputs.case }}
      CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'nightly' || inputs.cargo_profile }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # The trusted scripts are restored from the verified base commit only
          # (the same revision the base binary was built from), so candidate
          # content can never replace controller/summary/metadata code that
          # runs in this job.
          ref: ${{ needs.build.outputs.verified-base-sha }}
          path: trusted-src
          persist-credentials: false

      - name: Restore trusted query regression scripts
        shell: bash
        run: |
          set -euo pipefail
          # Fresh $RUNNER_TEMP directory; scripts are never taken from the
          # build artifact (candidate-controlled) or from the workspace where
          # the candidate checkout lives.
          trusted_dir="${RUNNER_TEMP}/query-regression-trusted-scripts"
          rm -rf "${trusted_dir}"
          mkdir -p "${trusted_dir}"
          for script in query-regression-ack-controller.py query-regression-summary.py query-regression-pr-metadata.py; do
            git -C "${GITHUB_WORKSPACE}/trusted-src" show "${VERIFIED_BASE_SHA}:.github/scripts/${script}" \
              > "${trusted_dir}/${script}" || {
                printf 'Trusted script %s is missing from verified base commit %s.\n' \
                  "${script}" "${VERIFIED_BASE_SHA}" >&2
                printf 'It must be merged to the base/default branch before a query-regression run can be admitted.\n' >&2
                exit 1
              }
            test -s "${trusted_dir}/${script}"
          done
          python3 - "${trusted_dir}" "${VERIFIED_BASE_SHA}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          trusted_dir = Path(sys.argv[1])
          source_sha = sys.argv[2]
          manifest = {"source_sha": source_sha, "files": {}}
          for path in sorted(trusted_dir.iterdir()):
              if path.is_file() and path.name.endswith(".py"):
                  manifest["files"][path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (trusted_dir / "trusted-scripts-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          test -s "${trusted_dir}/trusted-scripts-manifest.json"
          printf 'TRUSTED_SCRIPTS_DIR=%s\n' "${trusted_dir}" >> "${GITHUB_ENV}"
          printf 'Trusted scripts restored from %s to %s\n' "${VERIFIED_BASE_SHA}" "${trusted_dir}"

      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # The exact verified candidate/merge SHA from the build job outputs —
          # the same revision the candidate binaries were built from.
          ref: ${{ needs.build.outputs.verified-candidate-sha }}
          path: src
          persist-credentials: false

      - name: Download query regression base binaries
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.base-artifact-id }}
          path: query-regression-artifacts/base
          merge-multiple: true

      - name: Download query regression candidate binaries
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact-id }}
          path: query-regression-artifacts/candidate
          merge-multiple: true

      - name: Verify build manifests and binary attestation
        shell: bash
        run: |
          set -euo pipefail
          base_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/base"
          candidate_dir="${GITHUB_WORKSPACE}/query-regression-artifacts/candidate"
          cd "${GITHUB_WORKSPACE}"
          [[ -f "${base_dir}/base-manifest.json" ]] || {
            printf 'base-manifest.json is missing from the downloaded base artifact.\n' >&2
            exit 1
          }
          [[ -f "${candidate_dir}/candidate-manifest.json" ]] || {
            printf 'candidate-manifest.json is missing from the downloaded candidate artifact.\n' >&2
            exit 1
          }
          python3 - <<'PY' > .query-regression-attestation.sha256
          import json

          base = json.load(open("query-regression-artifacts/base/base-manifest.json", encoding="utf-8"))
          candidate = json.load(open("query-regression-artifacts/candidate/candidate-manifest.json", encoding="utf-8"))
          for manifest, prefix in (
              (base, "query-regression-artifacts/base/"),
              (candidate, "query-regression-artifacts/candidate/"),
          ):
              for entry in manifest["binaries"]:
                  print(f"{entry['sha256']}  {prefix}{entry['path']}")
          PY
          if ! sha256sum -c .query-regression-attestation.sha256; then
            printf 'binary attestation mismatch: downloaded binaries do not match the build manifests.\n' >&2
            exit 1
          fi
          base_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base_sha"])' "${base_dir}/base-manifest.json")"
          candidate_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_sha"])' "${candidate_dir}/candidate-manifest.json")"
          for sha in "${base_sha}" "${candidate_sha}" "${VERIFIED_BASE_SHA}" "${VERIFIED_CANDIDATE_SHA}"; do
            [[ "${sha}" =~ ^[[:xdigit:]]{40}$ ]] || {
              printf 'SHA is not a full 40-hex digest: %s\n' "${sha}" >&2
              exit 1
            }
          done
          [[ "${base_sha,,}" == "${VERIFIED_BASE_SHA,,}" ]] || {
            printf 'base-manifest base_sha %s does not match verified base SHA %s.\n' \
              "${base_sha}" "${VERIFIED_BASE_SHA}" >&2
            exit 1
          }
          [[ "${candidate_sha,,}" == "${VERIFIED_CANDIDATE_SHA,,}" ]] || {
            printf 'candidate-manifest candidate_sha %s does not match verified candidate SHA %s.\n' \
              "${candidate_sha}" "${VERIFIED_CANDIDATE_SHA}" >&2
            exit 1
          }
          # The candidate checkout must be the exact verified candidate SHA.
          checkout_sha="$(git -C "${GITHUB_WORKSPACE}/src" rev-parse HEAD)"
          [[ "${checkout_sha,,}" == "${VERIFIED_CANDIDATE_SHA,,}" ]] || {
            printf 'Checked-out candidate %s does not match verified candidate SHA %s.\n' \
              "${checkout_sha,,}" "${VERIFIED_CANDIDATE_SHA,,}" >&2
            exit 1
          }
          printf 'Verified base SHA: %s\n' "${base_sha}"
          printf 'Verified candidate SHA: %s\n' "${candidate_sha}"

      - name: Prepare ACK kubeconfig
        env:
          ACK_KUBECONFIG: ${{ secrets.ACK_KUBECONFIG }}
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null 2>&1 || {
            printf 'kubectl is required on the %s runner; see the query-regression README (controller prerequisites).\n' \
              "${{ github.event_name != 'pull_request' && inputs.runner || 'perf-regression-8-cores' }}" >&2
            exit 1
          }
          if [[ -n "${ACK_KUBECONFIG:-}" ]]; then
            umask 077
            mkdir -p "${RUNNER_TEMP}"
            printf '%s' "${ACK_KUBECONFIG}" > "${RUNNER_TEMP}/ack-kubeconfig"
            printf 'KUBECONFIG=%s\n' "${RUNNER_TEMP}/ack-kubeconfig" >> "${GITHUB_ENV}"
          fi
          printf 'kubectl client: '
          kubectl version --client -o yaml 2>/dev/null | sed -n 's/^    gitVersion: /v/p' | head -n 1 || true

      - name: Run ACK query regression controller
        id: controller
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Digest-pinned runtime image: the same image the ARC scale sets
          # used. No new image is built or pushed by this workflow.
          JOB_IMAGE: greptime-registry.cn-hangzhou.cr.aliyuncs.com/greptime/greptimedb-query-regression-runner@sha256:e713b294e23b7e15184e558866c90025e59930033e72c97650dbc7f1ca022d11
        run: >-
          python3 "${TRUSTED_SCRIPTS_DIR}/query-regression-ack-controller.py"
          --base-artifact-dir "${GITHUB_WORKSPACE}/query-regression-artifacts/base"
          --candidate-artifact-dir "${GITHUB_WORKSPACE}/query-regression-artifacts/candidate"
          --candidate-src "${GITHUB_WORKSPACE}/src"
          --trusted-summary "${TRUSTED_SCRIPTS_DIR}/query-regression-summary.py"
          --trusted-scripts-manifest "${TRUSTED_SCRIPTS_DIR}/trusted-scripts-manifest.json"
          --payload-dir "${RUNNER_TEMP}/query-regression-payload"
          --result-dir "${GITHUB_WORKSPACE}"

      - name: Clean up ACK benchmark job (second process, best effort)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Second-process cleanup: if the controller step failed or was
          # terminated (its finally may not have run), delete only the exact
          # deterministic Job for this run. Exact-name validation is identical
          # to the controller path. Under GitHub hard cancellation no further
          # steps run; recovery is documented in the README.
          trusted_dir="${TRUSTED_SCRIPTS_DIR:-}"
          if [[ -z "${trusted_dir}" ]]; then
            echo "trusted scripts not restored; nothing to clean up"
            exit 0
          fi
          python3 "${trusted_dir}/query-regression-ack-controller.py" \
            --cleanup-only \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --namespace "${ACK_JOB_NAMESPACE:-arc-runners}" \
            --delete-timeout 120 \
            --delete-attempts 3

      - name: Write PR metadata for trusted comment workflow
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: uv run --no-project python "${TRUSTED_SCRIPTS_DIR}/query-regression-pr-metadata.py"

      - name: Upload query regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-report
          path: |
            query-regression-work/**/query-regression-report.json
            query-regression-work/**/base/report.json
            query-regression-work/**/candidate/report.json
            query-regression-work/**/logs/**
            query-regression-work/**/otelgen/**
            query-regression-summary.md
            query-regression-pod.log
            query-regression-pod-describe.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload trusted comment artifact
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: query-regression-comment
          path: |
            query-regression-pr.json
            query-regression-work/**/query-regression-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on regression failure
        if: ${{ steps.controller.outputs.status != '0' }}
        run: exit 1
