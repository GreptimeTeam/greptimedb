name: Query Regression Comment

# Follows the trusted `Query Regression Controller` workflow (which validated
# the originating run/artifacts/PR/SHA chain and regenerated the comment
# metadata from the validated values). Write isolation: `pull-requests: write`
# exists only in this workflow; the controller workflow itself never writes to
# PRs.
#
# `query-regression-comment.cjs` (default-branch trusted code) re-validates the
# whole chain before posting (any failure skips the comment, fail closed):
#   * pins the downloaded comment artifact to THIS controller run (metadata
#     run_id/run_attempt vs the workflow_run payload) — replay rejection;
#   * independently re-validates this controller run from the GitHub API
#     (workflow name, workflow_run event, head repository, conclusion);
#   * resolves the ORIGINAL source build run from the controller-generated
#     metadata `source_run_id`/`source_run_attempt` and re-validates it from
#     the GitHub API (workflow name, pull_request event, success conclusion,
#     exact attempt, head SHA, head repository) — fork/spoof rejection;
#   * re-validates PR membership of the source run (pull_requests or the fork
#     fallback) and the current PR (open state, base/head repositories, head
#     SHA) — stale/moved PR rejection.
on:
  workflow_run:
    workflows: ["Query Regression Controller"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: >-
      ${{ github.repository == 'GreptimeTeam/greptimedb' &&
          github.event.workflow_run.conclusion != 'cancelled' &&
          github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Locate query regression comment artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
              per_page: 100,
            });
            const artifact = data.artifacts.find(
              item => item.name === 'query-regression-comment' && !item.expired
            );
            if (!artifact) {
              core.info('No query-regression-comment artifact found; skipping.');
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('id', String(artifact.id));

      - name: Download query regression comment artifact
        id: download
        if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: query-regression-comment
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Validate PR metadata and prepare comment
        id: validate
        if: ${{ steps.download.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            const validate = require('./.github/scripts/query-regression-comment.cjs');
            await validate({ github, context, core });

      - name: Post sticky PR comment
        if: ${{ steps.validate.outputs.should_post == 'true' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: query-regression-report
          number: ${{ steps.validate.outputs.pr_number }}
          path: ${{ steps.validate.outputs.summary_path }}
