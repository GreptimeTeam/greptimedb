name: Narthex Native CI (nightly)

# GitHub runs a `schedule` trigger only from the repository's default branch, so a schedule declared
# in a workflow that exists only on `narthex` would never fire. This file belongs on the default
# branch, and it checks out `narthex` itself: the schedule selects the branch, not the file's
# location.
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: The narthex revision to test
        required: false
        default: narthex

permissions:
  contents: read

jobs:
  correctness:
    name: Native correctness on narthex
    uses: ./.github/workflows/narthex-native-ci.yml
    with:
      # The reusable workflow checks this out for every build and test job.
      candidate_ref: ${{ inputs.ref || 'narthex' }}
    secrets: inherit
