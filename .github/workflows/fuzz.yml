on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - 'docs/**'
      - 'config/**'
      - '**.md'
      - '.dockerignore'
      - 'docker/**'
      - '.gitignore'
      - 'grafana/**'
      - 'Makefile'

name: Fuzz CI

env:
  CARGO_FUZZ_VERSION: "0.13.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' }}
    name: Build GreptimeDB binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shares across multiple jobs
          shared-key: "build-binaries"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-gc-bin
        shell: bash
        run: cargo install cargo-gc-bin --force
      - name: Build greptime binaries
        shell: bash
        # `cargo gc` will invoke `cargo build` with specified args
        run: cargo gc -- --bin greptime --bin sqlness-runner --features "pg_kvbackend,mysql_kvbackend,vector_index"
      - name: Pack greptime binaries
        shell: bash
        run: |
          mkdir bins && \
          mv ./target/debug/greptime bins && \
          mv ./target/debug/sqlness-runner bins
      - name: Print greptime binaries info
        run: ls -lh bins
      - name: Upload artifacts
        uses: ./.github/actions/upload-artifacts
        with:
          artifacts-dir: bins
          version: current

  prepare-fuzz-targets:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Prepare Fuzz Targets (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group:
          - name: "Database and regular table"
            id: "database-and-regular-table"
            targets: |
              fuzz_create_database
              fuzz_create_table
              fuzz_alter_table
              fuzz_insert
          - name: "Logical table"
            id: "logical-table"
            targets: |
              fuzz_create_logical_table
              fuzz_alter_logical_table
              fuzz_insert_logical_table
          - name: "Repartition"
            id: "repartition"
            targets: |
              fuzz_repartition_table
              fuzz_repartition_metric_table
              fuzz_repartition_table_chaos
          - name: "Logical pruning"
            id: "logical-pruning"
            targets: fuzz_remote_wal_logical_prune
          - name: "Migration"
            id: "migration"
            targets: |
              fuzz_migrate_mito_regions
              fuzz_migrate_metric_regions
          - name: "Failover"
            id: "failover"
            targets: |
              fuzz_failover_mito_regions
              fuzz_failover_metric_regions
          - name: "Unstable create table"
            id: "unstable-fuzz-create-table"
            targets: unstable_fuzz_create_table_standalone
            unstable: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-fuzz-${{ env.CARGO_FUZZ_VERSION }}"
          shared-key: "fuzz-dependencies"
          workspaces: "tests-fuzz -> tests-fuzz/target"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Look up prebuilt fuzz binaries
        id: fuzz-binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-${{ matrix.group.id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}
          lookup-only: true
      - name: Remove unused software
        if: steps.fuzz-binaries.outputs.cache-hit != 'true'
        run: |
          echo "Disk space before:"
          df -h
          [[ -d /usr/share/dotnet ]] && sudo rm -rf /usr/share/dotnet
          [[ -d /usr/local/lib/android ]] && sudo rm -rf /usr/local/lib/android
          [[ -d /opt/ghc ]] && sudo rm -rf /opt/ghc
          [[ -d /opt/hostedtoolcache/CodeQL ]] && sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "Disk space after:"
          df -h
      - name: Set Rust Fuzz
        if: steps.fuzz-binaries.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get install -y libfuzzer-14-dev
          cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
      - name: Build fuzz target binaries
        if: steps.fuzz-binaries.outputs.cache-hit != 'true'
        shell: bash
        env:
          CUSTOM_LIBFUZZER_PATH: /usr/lib/llvm-14/lib/libFuzzer.a
          FUZZ_TARGETS: ${{ matrix.group.targets }}
          FUZZ_UNSTABLE: ${{ matrix.group.unstable || false }}
          FUZZ_BIN_DIR: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --manifest-path tests-fuzz/Cargo.toml --no-deps --format-version 1 | jq -r '.target_directory')"
          mkdir -p "${FUZZ_BIN_DIR}"
          while IFS= read -r target; do
            [[ -z "${target}" ]] && continue
            args=(fuzz build "${target}" --fuzz-dir tests-fuzz -D -s none)
            if [[ "${FUZZ_UNSTABLE}" == true ]]; then
              args+=(--features unstable)
            fi
            cargo "${args[@]}"
            binary="$(find "${target_dir}" -type f -path "*/debug/${target}" -perm -u+x -print -quit)"
            if [[ -z "${binary}" ]]; then
              echo "Unable to locate built fuzz target: ${target}" >&2
              exit 1
            fi
            cp "${binary}" "${FUZZ_BIN_DIR}/${target}"
          done <<<"${FUZZ_TARGETS}"
      - name: Save prebuilt fuzz binaries
        if: steps.fuzz-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-${{ matrix.group.id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}

  fuzztest:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Fuzz Test (Standalone, ${{ matrix.group.name }})
    needs: [build, prepare-fuzz-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group:
          - name: "Database and regular table"
            id: "database-and-regular-table"
            targets: |
              fuzz_create_database
              fuzz_create_table
              fuzz_alter_table
              fuzz_insert
          - name: "Logical table"
            id: "logical-table"
            targets: |
              fuzz_create_logical_table
              fuzz_alter_logical_table
              fuzz_insert_logical_table
    steps:
      - name: Remove unused software
        run: |
          echo "Disk space before:"
          df -h
          [[ -d /usr/share/dotnet ]] && sudo rm -rf /usr/share/dotnet
          [[ -d /usr/local/lib/android ]] && sudo rm -rf /usr/local/lib/android
          [[ -d /opt/ghc ]] && sudo rm -rf /opt/ghc
          [[ -d /opt/hostedtoolcache/CodeQL ]] && sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "Disk space after:"
          df -h
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-fuzz-${{ env.CARGO_FUZZ_VERSION }}"
          shared-key: "fuzz-tools"
          workspaces: "tests-fuzz -> tests-fuzz/target"
          cache-targets: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore prebuilt fuzz binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-${{ matrix.group.id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}
      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: bins
          path: .
      - name: Unzip binaries
        run: |
          tar -xvf ./bins.tar.gz
          rm ./bins.tar.gz
      - name: Run GreptimeDB
        run: |
          mkdir -p /tmp/greptime-fuzz-runtime
          ./bins/greptime standalone start >/tmp/greptime-fuzz-runtime/greptime.log 2>&1 &
      - name: Fuzz Test
        uses: ./.github/actions/fuzz-test
        env:
          GT_MYSQL_ADDR: 127.0.0.1:4002
          FUZZ_SERVICE_LOG: /tmp/greptime-fuzz-runtime/greptime.log
        with:
          targets: ${{ matrix.group.targets }}
          group: ${{ matrix.group.id }}
          max-total-time: 120
          fail-fast: 'true'
          prebuilt-binaries-dir: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
      - name: Collect setup failure artifacts
        if: ${{ failure() && !cancelled() }}
        shell: bash
        env:
          FUZZ_COLLECT_CLUSTER_ARTIFACTS: 'false'
          FUZZ_SERVICE_LOG: /tmp/greptime-fuzz-runtime/greptime.log
          FUZZ_GROUP: ${{ matrix.group.id }}
        run: |
          if [[ ! -f /tmp/greptime-fuzz-artifacts/manifest.json ]]; then
            .github/scripts/collect-fuzz-target-artifacts.sh \
              setup /tmp/greptime-fuzz-artifacts/targets/setup || true
          fi
      - name: Upload fuzz test artifacts
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/upload-fuzz-artifacts
        with:
          artifact-name: fuzz-standalone-${{ matrix.group.id }}

  unstable-fuzztest:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Unstable Fuzz Test
    needs: [build-greptime-ci, prepare-fuzz-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Remove unused software
        run: |
          echo "Disk space before:"
          df -h
          [[ -d /usr/share/dotnet ]] && sudo rm -rf /usr/share/dotnet
          [[ -d /usr/local/lib/android ]] && sudo rm -rf /usr/local/lib/android
          [[ -d /opt/ghc ]] && sudo rm -rf /opt/ghc
          [[ -d /opt/hostedtoolcache/CodeQL ]] && sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "Disk space after:"
          df -h
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-fuzz-${{ env.CARGO_FUZZ_VERSION }}"
          shared-key: "fuzz-tools"
          workspaces: "tests-fuzz -> tests-fuzz/target"
          cache-targets: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore prebuilt fuzz binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/unstable-fuzz-create-table
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-unstable-fuzz-create-table-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}
      - name: Download pre-built binary
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: .
      - name: Unzip binary
        run: |
          tar -xvf ./bin.tar.gz
          rm ./bin.tar.gz
      - name: Run Fuzz Test
        uses: ./.github/actions/fuzz-test
        env:
          GT_MYSQL_ADDR: 127.0.0.1:4002
          GT_FUZZ_BINARY_PATH: ./bin/greptime
          GT_FUZZ_INSTANCE_ROOT_DIR: /tmp/greptime-fuzz-artifacts/targets/unstable_fuzz_create_table_standalone/service/instance/
        with:
          targets: unstable_fuzz_create_table_standalone
          group: unstable-fuzz-create-table
          max-total-time: 120
          unstable: 'true'
          fail-fast: 'true'
          prebuilt-binaries-dir: ${{ runner.temp }}/greptime-fuzz-binaries/unstable-fuzz-create-table
      - name: Collect setup failure artifacts
        if: ${{ failure() && !cancelled() }}
        shell: bash
        env:
          FUZZ_COLLECT_CLUSTER_ARTIFACTS: 'false'
          FUZZ_GROUP: unstable-fuzz-create-table
        run: |
          if [[ ! -f /tmp/greptime-fuzz-artifacts/manifest.json ]]; then
            .github/scripts/collect-fuzz-target-artifacts.sh \
              setup /tmp/greptime-fuzz-artifacts/targets/setup || true
          fi
      - name: Upload fuzz test artifacts
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/upload-fuzz-artifacts
        with:
          artifact-name: fuzz-unstable-standalone

  build-greptime-ci:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' }}
    name: Build GreptimeDB binary (profile-CI)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Shares across multiple jobs
          shared-key: "build-greptime-ci"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-gc-bin
        shell: bash
        run: cargo install cargo-gc-bin --force
      - name: Build greptime binary
        shell: bash
        # `cargo gc` will invoke `cargo build` with specified args
        run: cargo gc --profile ci -- --bin greptime --features "pg_kvbackend,mysql_kvbackend"
      - name: Pack greptime binary
        shell: bash
        run: |
          mkdir bin && \
          mv ./target/ci/greptime bin
      - name: Print greptime binaries info
        run: ls -lh bin
      - name: Upload artifacts
        uses: ./.github/actions/upload-artifacts
        with:
          artifacts-dir: bin
          version: current

  distributed-fuzztest:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Fuzz Test (Distributed, ${{ matrix.mode.name }}, ${{ matrix.group.name }})
    runs-on: ubuntu-latest
    needs: [build-greptime-ci, prepare-fuzz-targets]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group:
          - name: "Database and regular table"
            id: "database-and-regular-table"
            targets: |
              fuzz_create_database
              fuzz_create_table
              fuzz_alter_table
              fuzz_insert
          - name: "Logical table"
            id: "logical-table"
            targets: |
              fuzz_create_logical_table
              fuzz_alter_logical_table
              fuzz_insert_logical_table
        mode:
          - name: "Remote WAL"
            id: "remote-wal"
            minio: true
            kafka: true
            values: "with-remote-wal.yaml"
        include:
          - group:
              name: "Repartition"
              id: "repartition"
              targets: |
                fuzz_repartition_table
                fuzz_repartition_metric_table
            mode:
              name: "Local WAL"
              id: "local-wal"
              minio: true
              kafka: false
              values: "with-minio-repartition-gc.yaml"
          - group:
              name: "Logical pruning"
              id: "logical-pruning"
              targets: "fuzz_remote_wal_logical_prune"
            mode:
              name: "Remote WAL logical pruning"
              id: "remote-wal-logical-pruning"
              minio: true
              kafka: true
              values: "with-remote-wal-logical-prune.yaml"
              kafkaWalHelper: true
    steps:
      - name: Remove unused software
        run: |
          echo "Disk space before:"
          df -h
          [[ -d /usr/share/dotnet ]] && sudo rm -rf /usr/share/dotnet
          [[ -d /usr/local/lib/android ]] && sudo rm -rf /usr/local/lib/android
          [[ -d /opt/ghc ]] && sudo rm -rf /opt/ghc
          [[ -d /opt/hostedtoolcache/CodeQL ]] && sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "Disk space after:"
          df -h
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Kind
        uses: ./.github/actions/setup-kind
      - if: matrix.mode.minio
        name: Setup Minio
        uses: ./.github/actions/setup-minio
      - if: matrix.mode.kafka
        name: Setup Kafka cluster
        uses: ./.github/actions/setup-kafka-cluster
      - name: Setup Etcd cluster
        uses: ./.github/actions/setup-etcd-cluster
      # Prepares for fuzz tests
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-fuzz-${{ env.CARGO_FUZZ_VERSION }}"
          shared-key: "fuzz-tools"
          workspaces: "tests-fuzz -> tests-fuzz/target"
          cache-targets: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore prebuilt fuzz binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-${{ matrix.group.id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}
      # Downloads ci image
      - name: Download pre-built binariy
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: .
      - name: Unzip binary
        run: |
          tar -xvf ./bin.tar.gz
          rm ./bin.tar.gz
      - name: Build and push GreptimeDB image
        uses: ./.github/actions/build-and-push-ci-image
      - if: matrix.mode.kafkaWalHelper
        name: Build Kafka WAL helper binary
        shell: bash
        run: |
          cargo build --bin kafka_wal_helper
          mkdir -p amd64
          cp target/debug/kafka_wal_helper amd64/kafka_wal_helper
      - if: matrix.mode.kafkaWalHelper
        name: Build and push Kafka WAL helper image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/ci/ubuntu/Dockerfile.kafka-wal-helper
          push: true
          tags: localhost:5001/greptime/kafka-wal-helper:latest
          build-args: |
            TARGETARCH=amd64
            TARGET_BIN=kafka_wal_helper
      - name: Wait for etcd
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app.kubernetes.io/instance=etcd \
            --timeout=120s \
            -n etcd-cluster
      - if: matrix.mode.minio
        name: Wait for minio
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app=minio \
            --timeout=120s \
            -n minio
      - if: matrix.mode.kafka
        name: Wait for kafka
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app.kubernetes.io/instance=kafka \
            --timeout=180s \
            -n kafka-cluster
      - if: matrix.mode.kafkaWalHelper
        name: Setup Kafka WAL helper
        shell: bash
        run: |
          kubectl -n kafka-cluster apply \
            -f .github/actions/setup-greptimedb-cluster/kafka-wal-helper.yaml

          kubectl -n kafka-cluster wait \
            --for=condition=Ready \
            pod -l app=kafka-wal-helper \
            --timeout=120s
      - name: Print etcd info
        shell: bash
        run: kubectl get all --show-labels -n etcd-cluster
      # Setup cluster for test
      - name: Setup GreptimeDB cluster
        uses: ./.github/actions/setup-greptimedb-cluster
        with:
          image-registry: localhost:5001
          values-filename: ${{ matrix.mode.values }}
      - name: Port forward (mysql)
        run: |
          kubectl port-forward service/my-greptimedb-frontend 4002:4002 -n my-greptimedb&
      - if: matrix.mode.kafkaWalHelper
        name: Port forward Kafka WAL helper
        run: |
          kubectl port-forward service/kafka-wal-helper 8080:8080 -n kafka-cluster&
      - if: matrix.mode.kafka
        name: Check Kafka readiness
        shell: bash
        run: |
          .github/scripts/wait-kafka-ready.sh
      - name: Fuzz Test
        uses: ./.github/actions/fuzz-test
        env:
          GT_MYSQL_ADDR: 127.0.0.1:4002
          GT_KAFKA_WAL_HELPER_URL: http://127.0.0.1:8080
          GT_KAFKA_ADDR: kafka.kafka-cluster.svc.cluster.local:9092
          GT_WAL_TOPIC_PREFIX: greptimedb_wal_topic
          GT_WAL_NUM_TOPICS: 3
          GT_FUZZ_OVERRIDE_DELETE_AFTER_SECS: 300
        with:
          targets: ${{ matrix.group.targets }}
          group: ${{ matrix.group.id }}
          max-total-time: ${{ matrix.mode.kafkaWalHelper && 600 || 120 }}
          fail-fast: 'true'
          collect-cluster-artifacts: 'true'
          prebuilt-binaries-dir: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
      - name: Collect setup failure artifacts
        if: ${{ failure() && !cancelled() }}
        shell: bash
        env:
          FUZZ_COLLECT_CLUSTER_ARTIFACTS: 'true'
          GT_FUZZ_NS: my-greptimedb
          GT_FUZZ_CLUSTER: my-greptimedb
          GT_MONITOR_HTTP_LOCAL_PORT: 14000
          FUZZ_GROUP: ${{ matrix.group.id }}
        run: |
          if [[ ! -f /tmp/greptime-fuzz-artifacts/manifest.json ]]; then
            timeout --signal=TERM --kill-after=10s 180s \
              .github/scripts/collect-fuzz-target-artifacts.sh \
              setup /tmp/greptime-fuzz-artifacts/targets/setup || true
          fi
      - name: Upload fuzz test artifacts
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/upload-fuzz-artifacts
        with:
          artifact-name: fuzz-distributed-${{ matrix.mode.id }}-${{ matrix.group.id }}
      - name: Delete cluster
        if: success()
        shell: bash
        run: |
          kind delete cluster
          docker stop $(docker ps -a -q)
          docker rm $(docker ps -a -q)
          docker system prune -f

  distributed-fuzztest-with-chaos:
    if: ${{ github.repository == 'GreptimeTeam/greptimedb' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    name: Fuzz Test with Chaos (Distributed, ${{ matrix.mode.name }}, ${{ matrix.group.name }})
    runs-on: ubuntu-latest
    needs: [build-greptime-ci, prepare-fuzz-targets]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group:
          - name: "Migration"
            id: "migration"
            targets: |
              fuzz_migrate_mito_regions
              fuzz_migrate_metric_regions
          - name: "Failover"
            id: "failover"
            targets: |
              fuzz_failover_mito_regions
              fuzz_failover_metric_regions
        mode:
          - name: "Remote WAL"
            id: "remote-wal"
            minio: true
            kafka: true
            values: "with-remote-wal.yaml"
        include:
          - group:
              name: "Migration"
              id: "migration"
              targets: |
                fuzz_migrate_mito_regions
                fuzz_migrate_metric_regions
            mode:
              name: "Local WAL"
              id: "local-wal"
              minio: true
              kafka: false
              values: "with-minio.yaml"
          - group:
              name: "Repartition"
              id: "repartition"
              targets: "fuzz_repartition_table_chaos"
            mode:
              name: "Local WAL repartition chaos"
              id: "local-wal-repartition-chaos"
              minio: true
              kafka: false
              values: "with-minio-repartition-gc.yaml"
    steps:
      - name: Remove unused software
        run: |
          echo "Disk space before:"
          df -h
          [[ -d /usr/share/dotnet ]] && sudo rm -rf /usr/share/dotnet
          [[ -d /usr/local/lib/android ]] && sudo rm -rf /usr/local/lib/android
          [[ -d /opt/ghc ]] && sudo rm -rf /opt/ghc
          [[ -d /opt/hostedtoolcache/CodeQL ]] && sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          echo "Disk space after:"
          df -h
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Kind
        uses: ./.github/actions/setup-kind
      - name: Setup Chaos Mesh
        uses: ./.github/actions/setup-chaos
      - if: matrix.mode.minio
        name: Setup Minio
        uses: ./.github/actions/setup-minio
      - if: matrix.mode.kafka
        name: Setup Kafka cluster
        uses: ./.github/actions/setup-kafka-cluster
      - name: Setup Etcd cluster
        uses: ./.github/actions/setup-etcd-cluster
      # Prepares for fuzz tests
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-fuzz-${{ env.CARGO_FUZZ_VERSION }}"
          shared-key: "fuzz-tools"
          workspaces: "tests-fuzz -> tests-fuzz/target"
          cache-targets: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore prebuilt fuzz binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
          key: v1-fuzz-binaries-${{ env.CARGO_FUZZ_VERSION }}-${{ matrix.group.id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tests-fuzz/**', 'src/**') }}
      # Downloads ci image
      - name: Download pre-built binariy
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: .
      - name: Unzip binary
        run: |
          tar -xvf ./bin.tar.gz
          rm ./bin.tar.gz
      - name: Build and push GreptimeDB image
        uses: ./.github/actions/build-and-push-ci-image
      - name: Wait for etcd
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app.kubernetes.io/instance=etcd \
            --timeout=120s \
            -n etcd-cluster
      - if: matrix.mode.minio
        name: Wait for minio
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app=minio \
            --timeout=120s \
            -n minio
      - if: matrix.mode.kafka
        name: Wait for kafka
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod -l app.kubernetes.io/instance=kafka \
            --timeout=180s \
            -n kafka-cluster
      - name: Print etcd info
        shell: bash
        run: kubectl get all --show-labels -n etcd-cluster
      # Setup cluster for test
      - name: Setup GreptimeDB cluster
        uses: ./.github/actions/setup-greptimedb-cluster
        with:
          image-registry: localhost:5001
          values-filename: ${{ matrix.mode.values }}
          enable-region-failover: ${{ matrix.mode.kafka }}
      - name: Port forward (mysql)
        run: |
          kubectl port-forward service/my-greptimedb-frontend 4002:4002 -n my-greptimedb&
      - if: matrix.mode.kafka
        name: Check Kafka readiness
        shell: bash
        run: |
          .github/scripts/wait-kafka-ready.sh
      - name: Fuzz Test
        uses: ./.github/actions/fuzz-test
        env:
          GT_MYSQL_ADDR: 127.0.0.1:4002
        with:
          targets: ${{ matrix.group.targets }}
          group: ${{ matrix.group.id }}
          max-total-time: 120
          fail-fast: 'true'
          collect-cluster-artifacts: 'true'
          prebuilt-binaries-dir: ${{ runner.temp }}/greptime-fuzz-binaries/${{ matrix.group.id }}
      - name: Collect setup failure artifacts
        if: ${{ failure() && !cancelled() }}
        shell: bash
        env:
          FUZZ_COLLECT_CLUSTER_ARTIFACTS: 'true'
          GT_FUZZ_NS: my-greptimedb
          GT_FUZZ_CLUSTER: my-greptimedb
          GT_MONITOR_HTTP_LOCAL_PORT: 14000
          FUZZ_GROUP: ${{ matrix.group.id }}
        run: |
          if [[ ! -f /tmp/greptime-fuzz-artifacts/manifest.json ]]; then
            timeout --signal=TERM --kill-after=10s 180s \
              .github/scripts/collect-fuzz-target-artifacts.sh \
              setup /tmp/greptime-fuzz-artifacts/targets/setup || true
          fi
      - name: Upload fuzz test artifacts
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/upload-fuzz-artifacts
        with:
          artifact-name: fuzz-distributed-chaos-${{ matrix.mode.id }}-${{ matrix.group.id }}
      - name: Delete cluster
        if: success()
        shell: bash
        run: |
          kind delete cluster
          docker stop $(docker ps -a -q)
          docker rm $(docker ps -a -q)
          docker system prune -f

