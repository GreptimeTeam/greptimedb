name: Deploy GreptimeDB cluster
description: Deploy GreptimeDB cluster on Kubernetes
inputs:
  aws-ci-test-bucket:
    description: 'AWS S3 bucket name for testing'
    required: true
  aws-region:
    description: 'AWS region for testing'
    required: true
  data-root:
    description: 'Data root for testing'
    required: true
  aws-access-key-id:
    description: 'AWS access key id for testing'
    required: true
  aws-secret-access-key:
    description: 'AWS secret access key for testing'
    required: true
runs:
  using: composite
  steps:
    # Ubuntu 26.04 does not apply the runner's /etc/sysctl.conf at boot.
    # https://github.com/actions/runner-images/issues/15108
    - name: Configure inotify limits for kind
      shell: bash
      run: sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360

    - name: Deploy GreptimeDB by Helm
      shell: bash
      env:
        DATA_ROOT: ${{ inputs.data-root }}
        AWS_CI_TEST_BUCKET: ${{ inputs.aws-ci-test-bucket }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      run: |
        # Composite steps do not support timeout-minutes.
        timeout --kill-after=30s 30m ./.github/scripts/deploy-greptimedb.sh
