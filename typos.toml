[default.extend-words]
Pn = "Pn"
ue = "ue"
worl = "worl"
ot = "ot"
typ = "typ"
typs = "typs"
unqualifed = "unqualifed"
excluder = "excluder"
consts = "consts"
# Upstream crate rskafka defines a `DeadlineExceded` error variant, but it is misspelled. 
# We need to extend the word list to avoid typos in our codebase.
Exceded = "Exceded"
# Unicode general category `Nd` (decimal digit) used in the Go group-name regex.
Nd = "Nd"

[default.extend-identifiers]
allocatedp = "allocatedp"

[files]
extend-exclude = [
    "corrupted",
    "tests-fuzz/src/data/lorem_words",
    "*.sql",
    "*.result",
    "src/pipeline/benches/data.log",
    "cyborg/pnpm-lock.yaml",
    "tests-integration/resources/*",
    # Generated promql-compat golden fixtures: sample points are hex IEEE-754
    # bit patterns, which the spell checker reads as words.
    "src/promql/**/*_cases.txt"
]
